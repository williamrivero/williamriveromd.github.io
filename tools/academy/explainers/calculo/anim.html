<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;}canvas{display:block;}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
var TL = null; // set by the recorder: {scenes, amp, fps}
var c = document.getElementById('c'), x = c.getContext('2d');
var W = 1280, H = 720;
var TEAL = '#1a6b72', DTEAL = '#0e4a50', NAVY = '#1f3864', GOLD = '#b8860b', INK = '#1e2a38';
var F = 'Inter, system-ui, sans-serif';

function rr(X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
function box(X, Y, w, h, r, fill, stroke, lw) { rr(X, Y, w, h, r); if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw || 2; x.stroke(); } }
function txt(s, X, Y, size, color, weight, align) { x.font = (weight || 600) + ' ' + size + 'px ' + F; x.fillStyle = color; x.textAlign = align || 'left'; x.textBaseline = 'middle'; x.fillText(s, X, Y); }
function ease(u) { u = Math.max(0, Math.min(1, u)); return u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; }
function pop(u) { u = Math.max(0, Math.min(1, u)); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); }
function fadeIn(lt, at, d) { return Math.max(0, Math.min(1, (lt - at) / (d || .4))); }

/* ---------- waveforms ---------- */
function sinus(u) {            // u = phase in a beat, 0..1
  var y = 0;
  y += 0.12 * Math.exp(-Math.pow((u - 0.12) / 0.03, 2));          // P
  y -= 0.12 * Math.exp(-Math.pow((u - 0.25) / 0.008, 2));         // Q
  y += 1.0 * Math.exp(-Math.pow((u - 0.27) / 0.012, 2));          // R
  y -= 0.25 * Math.exp(-Math.pow((u - 0.295) / 0.012, 2));        // S
  y += 0.25 * Math.exp(-Math.pow((u - 0.5) / 0.05, 2));           // T
  return y;
}
function vf(t) { return 0.45 * Math.sin(t * 2 * Math.PI * 4.6) * (0.7 + 0.3 * Math.sin(t * 1.3)) + 0.2 * Math.sin(t * 2 * Math.PI * 6.9 + 1) + 0.12 * Math.sin(t * 2 * Math.PI * 2.1); }
function ecgAt(kind, t, hr) { if (kind === 'vf') return vf(t); var p = 60 / (hr || 72); return sinus((t % p) / p); }
function capAt(t, rr, v) {     // capnogram, height 0..1 scaled by v (0..1)
  var p = 60 / rr, u = (t % p) / p, y;
  if (u < 0.38) y = 0; else if (u < 0.46) y = 0.93 * (1 - Math.pow(1 - (u - 0.38) / 0.08, 3)); else if (u < 0.9) y = 0.93 + 0.07 * (u - 0.46) / 0.44;
  else if (u < 0.95) { var f = (u - 0.9) / 0.05; y = 1 - f * f * (3 - 2 * f); } else y = 0;
  return y * v;
}
/* draw a sweeping trace: fn(time)->value, in box; the sweep head is at time T */
function trace(X, Y, w, h, T, fn, color, gain, span) {
  span = span || w / 110; var head = (T % span) / span * w;
  x.save(); rr(X, Y, w, h, 8); x.clip();
  x.strokeStyle = color; x.lineWidth = 2.4; x.lineJoin = 'round';
  x.beginPath(); var first = true;
  for (var px = 0; px <= w; px += 1) {
    if (px > head && px < head + 14) { first = true; continue; }   // eraser gap
    var tt = px <= head ? T - (head - px) / w * span : T - span + (px - head) / w * span, v = 0, dt = span / w;
    for (var k = 0; k < 5; k++) { var vv = fn(tt + dt * k / 5); if (Math.abs(vv) > Math.abs(v)) v = vv; }   // keep narrow spikes
    var y = Y + h * 0.6 - v * gain;
    if (first) { x.moveTo(X + px, y); first = false; } else x.lineTo(X + px, y);
  }
  x.stroke(); x.restore();
}
/* a small bedside monitor */
function monitor(X, Y, w, h, T, st) {
  box(X, Y, w, h, 18, '#0b0f17', '#2b3444', 3);
  var pad = 14, top = Y + 12;
  if (st.alarm) { box(X + pad, top, w - 2 * pad - 4, 30, 8, st.alarmColor || '#c1121f'); txt(st.alarm, X + w / 2, top + 15, 15, st.alarmColor === '#f2c200' ? '#111' : '#fff', 800, 'center'); }
  var gx = X + pad, gw = w * 0.66 - pad, gy = top + 40, rows = st.capno ? 3 : 2, gh = (h - 66) / rows - 6;
  box(gx, gy, gw, gh, 8, '#0f1724'); trace(gx, gy, gw, gh, T, function (t) { return ecgAt(st.rhythm, t, st.hr); }, '#5ee08a', gh * 0.55);
  box(gx, gy + gh + 6, gw, gh, 8, '#0f1724');
  if (st.rhythm === 'vf') { x.strokeStyle = '#22d3ee'; x.lineWidth = 2; x.beginPath(); x.moveTo(gx + 6, gy + gh + 6 + gh * 0.7); x.lineTo(gx + gw - 6, gy + gh + 6 + gh * 0.7); x.stroke(); }
  else trace(gx, gy + gh + 6, gw, gh, T, function (t) { var p = 60 / st.hr, u = ((t - 0.2) % p + p) % p / p; return u < 0.2 ? Math.sin(u / 0.2 * Math.PI / 2) : Math.exp(-(u - 0.2) * 4.5) * (1 + 0.15 * Math.exp(-Math.pow((u - 0.42) / 0.05, 2))); }, '#22d3ee', gh * 0.5);
  if (st.capno) { var cy = gy + 2 * (gh + 6); box(gx, cy, gw, gh, 8, '#0f1724'); trace(gx, cy, gw, gh, T, function (t) { return capAt(t, st.rr || 10, (st.co2fn ? st.co2fn(t) : st.co2) / 50); }, '#fbbf24', gh * 0.8); }
  // numbers
  var nx = X + w * 0.66 + 6, nw = w * 0.34 - pad - 6, items = [['HR', st.hrShown, '#4ade80'], ['SpO₂', st.spo2, '#22d3ee']];
  if (st.capno) items.push(['EtCO₂', st.co2Shown, '#fbbf24']);
  var ih = (h - 66) / items.length - 6;
  items.forEach(function (it, i) {
    var iy = gy + i * (ih + 6); box(nx, iy, nw, ih, 8, '#0f1724');
    txt(it[0], nx + 10, iy + 16, 13, it[2], 700); txt(it[1], nx + 10, iy + ih * 0.62, Math.min(44, ih * 0.5), it[2], 800);
  });
}

/* ---------- the cartoon guide (an original character) ---------- */
function guide(T, amp, mode, lt) {
  var bx = 210, by = 620 + Math.sin(T * 2.2) * 3;     // feet line
  x.save();
  // shadow
  x.fillStyle = 'rgba(15,30,46,.12)'; x.beginPath(); x.ellipse(bx, 640, 120, 16, 0, 0, Math.PI * 2); x.fill();
  // body (scrubs)
  x.fillStyle = TEAL; rr(bx - 95, by - 250, 190, 250, 70); x.fill();
  x.fillStyle = '#15595f'; x.beginPath(); x.moveTo(bx - 34, by - 245); x.lineTo(bx, by - 200); x.lineTo(bx + 34, by - 245); x.closePath(); x.fill();   // V-neck
  // badge
  box(bx + 30, by - 185, 42, 26, 5, '#fff'); x.fillStyle = TEAL; x.fillRect(bx + 36, by - 177, 30, 4); x.fillRect(bx + 36, by - 169, 20, 4);
  // stethoscope
  x.strokeStyle = '#334155'; x.lineWidth = 6; x.lineCap = 'round'; x.beginPath(); x.moveTo(bx - 50, by - 238); x.quadraticCurveTo(bx - 60, by - 150, bx - 20, by - 140); x.stroke();
  x.fillStyle = '#94a3b8'; x.beginPath(); x.arc(bx - 16, by - 138, 10, 0, Math.PI * 2); x.fill();
  // arms
  var skin = '#c98a5b';
  x.strokeStyle = TEAL; x.lineWidth = 34;
  x.beginPath(); x.moveTo(bx - 80, by - 210); x.quadraticCurveTo(bx - 120, by - 120, bx - 95, by - 70); x.stroke();       // left arm down
  x.fillStyle = skin; x.beginPath(); x.arc(bx - 93, by - 62, 17, 0, Math.PI * 2); x.fill();
  var ang;   // right arm: wave in the intro, point toward the content otherwise
  if (mode === 'wave') ang = -0.95 + Math.sin(T * 7) * 0.22; else ang = -0.55 + Math.sin(T * 1.6) * 0.06;
  var sx = bx + 80, sy = by - 210, ex = sx + Math.cos(ang) * 70, ey = sy + Math.sin(ang) * 70 + 40, hx = ex + Math.cos(ang - 0.2) * 70, hy = ey + Math.sin(ang - 0.2) * 70;
  x.strokeStyle = TEAL; x.beginPath(); x.moveTo(sx, sy); x.lineTo(ex, ey); x.stroke();
  x.strokeStyle = skin; x.lineWidth = 26; x.beginPath(); x.moveTo(ex, ey); x.lineTo(hx, hy); x.stroke();
  x.fillStyle = skin; x.beginPath(); x.arc(hx, hy, 18, 0, Math.PI * 2); x.fill();
  // neck + head
  x.fillStyle = skin; x.fillRect(bx - 20, by - 280, 40, 40);
  var hy0 = by - 350 + Math.sin(T * 2.2 + .6) * 2, tilt = Math.sin(T * 1.3) * 0.04 + amp * 0.03;
  x.translate(bx, hy0); x.rotate(tilt);
  // hair back
  x.fillStyle = '#1f1611'; x.beginPath(); x.arc(0, -8, 86, Math.PI, 0); x.lineTo(86, 30); x.lineTo(-86, 30); x.closePath(); x.fill();
  x.beginPath(); x.arc(0, -96, 30, 0, Math.PI * 2); x.fill();   // bun
  // face
  x.fillStyle = skin; x.beginPath(); x.ellipse(0, 10, 76, 84, 0, 0, Math.PI * 2); x.fill();
  // ears
  x.beginPath(); x.ellipse(-76, 16, 12, 18, 0, 0, Math.PI * 2); x.ellipse(76, 16, 12, 18, 0, 0, Math.PI * 2); x.fill();
  // fringe
  x.fillStyle = '#1f1611'; x.beginPath(); x.moveTo(-78, -6); x.quadraticCurveTo(-60, -80, 10, -76); x.quadraticCurveTo(70, -72, 80, -6); x.quadraticCurveTo(40, -40, -10, -38); x.quadraticCurveTo(-50, -36, -78, -6); x.fill();
  // eyes (blink every ~3.7 s)
  var blink = ((T % 3.7) < 0.13) ? 0.12 : 1;
  x.fillStyle = '#1e1b18';
  [-30, 30].forEach(function (ex2) { x.beginPath(); x.ellipse(ex2, 8, 10, 13 * blink, 0, 0, Math.PI * 2); x.fill(); });
  x.fillStyle = '#fff'; if (blink > .5) [-27, 33].forEach(function (ex2) { x.beginPath(); x.arc(ex2, 3, 3.5, 0, Math.PI * 2); x.fill(); });
  // brows lift a little when speaking
  x.strokeStyle = '#1f1611'; x.lineWidth = 5; x.lineCap = 'round';
  [-1, 1].forEach(function (s) { x.beginPath(); x.moveTo(s * 18, -16 - amp * 4); x.quadraticCurveTo(s * 30, -24 - amp * 5, s * 44, -17 - amp * 4); x.stroke(); });
  // cheeks
  x.fillStyle = 'rgba(232,110,110,.35)'; x.beginPath(); x.ellipse(-46, 36, 13, 8, 0, 0, Math.PI * 2); x.ellipse(46, 36, 13, 8, 0, 0, Math.PI * 2); x.fill();
  // mouth: smile when quiet, opens with the voice
  var open = Math.min(1, amp * 1.25);
  if (open < 0.08) { x.strokeStyle = '#6b2b2b'; x.lineWidth = 5; x.beginPath(); x.arc(0, 40, 20, 0.2 * Math.PI, 0.8 * Math.PI); x.stroke(); }
  else {
    x.fillStyle = '#5a1f22'; x.beginPath(); x.ellipse(0, 50, 14 + open * 8, 4 + open * 15, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = '#e57373'; x.beginPath(); x.ellipse(0, 56 + open * 6, 9 + open * 4, 3 + open * 4, 0, 0, Math.PI); x.fill();
    x.fillStyle = '#fff'; x.fillRect(-10 - open * 4, 50 - (4 + open * 15) + 1, 20 + open * 8, 4);
  }
  x.restore();
}

/* ---------- caption ---------- */
function caption(sc, lt) {
  var s = sc.text.match(/[^.!?]+[.!?]+/g) || [sc.text], L = s.reduce(function (a, b) { return a + b.length; }, 0);
  var u = (lt - sc.lead) / sc.speech, acc = 0, cur = s[s.length - 1];
  for (var i = 0; i < s.length; i++) { acc += s[i].length / L; if (u < acc) { cur = s[i]; break; } }
  if (lt < sc.lead * 0.6) return;
  cur = cur.trim(); x.font = '600 24px ' + F; var lines = [cur];
  if (x.measureText(cur).width > 1100) {   // two lines, split near the middle at a word
    var wds = cur.split(' '), best = 0, bd = 1e9;
    for (var j = 1; j < wds.length; j++) { var d = Math.abs(x.measureText(wds.slice(0, j).join(' ')).width - x.measureText(wds.slice(j).join(' ')).width); if (d < bd) { bd = d; best = j; } }
    lines = [wds.slice(0, best).join(' '), wds.slice(best).join(' ')];
  }
  var wdt = Math.max.apply(null, lines.map(function (l) { return x.measureText(l).width; })) + 48, hh = lines.length * 32 + 14, top = 700 - hh;
  box(W / 2 - wdt / 2, top, wdt, hh, 12, 'rgba(15,23,42,.82)');
  lines.forEach(function (l, j) { txt(l, W / 2, top + 23 + j * 32, 24, '#fff', 600, 'center'); });
}

/* ---------- Calculo scenes ---------- */
var R = 400, IND = '#312e81', IND2 = '#3730a3', AMBER = '#b45309';
function chip(X, Y, label, bg, fg, sz, h) { sz = sz || 15; h = h || 30; x.font = '700 ' + sz + 'px ' + F; var w = x.measureText(label).width + 24; box(X, Y, w, h, h / 2, bg); txt(label, X + w / 2, Y + h / 2, sz, fg, 700, 'center'); return w; }
function calcIcon(X, Y, s, col) { x.save(); x.translate(X, Y); x.scale(s, s); box(-16, -20, 32, 40, 6, col); box(-11, -15, 22, 9, 2, 'rgba(255,255,255,.85)');
  for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) box(-11 + c * 8, -2 + r * 7, 6, 5, 1, 'rgba(255,255,255,.7)'); x.restore(); }
function field(X, Y, w, label, val, hl) { txt(label, X, Y, 14, '#475569', 700); box(X, Y + 12, w, 38, 8, hl ? '#fef3c7' : '#f8fafc', hl ? '#f59e0b' : '#cbd5e1', hl ? 2 : 1.5); txt(val, X + 12, Y + 31, 17, INK, 700); }
function card(X, Y, w, h, title) { box(X, Y, w, h, 14, '#fff', '#dfe6f0', 2); x.save(); rr(X, Y, w, h, 14); x.clip(); x.fillStyle = TEAL; x.fillRect(X, Y, w, 5); x.restore(); txt(title, X + 22, Y + 34, 19, NAVY, 800); }
var CATS = [['Kidney Function & GFR', '#1a6b72'], ['Pharmacology & Dosing', '#0d9488'], ['Cardiometabolic', '#be185d'], ['Critical Care & Emergency', '#dc2626'],
  ['Pediatric Nephrology', '#ea580c'], ['Neurology & Stroke', '#6366f1'], ['Oncology & Urology', '#7c3aed'], ['Rheumatology', '#0369a1']];
var scenes = [
  function title(lt, T) {
    var a = pop(fadeIn(lt, .2, .7)); x.save(); x.globalAlpha = Math.min(1, a); x.translate(0, (1 - a) * 30);
    box(R + 10, 66, 520, 58, 29, 'rgba(49,46,129,.10)'); txt('RENAL CARE MATTERS  ·  CALCULO', R + 40, 95, 18, IND, 800);
    txt('Calculo', R + 30, 196, 84, NAVY, 800); txt('clinical calculators, every specialty', R + 32, 262, 34, GOLD, 800); x.restore();
    var cols = CATS.map(function (c) { return c[1]; }); var n = 0;
    for (var r = 0; r < 4; r++) for (var c = 0; c < 9; c++) { var i = r * 9 + c, u = pop(fadeIn(lt, 1.6 + i * .06, .35)); if (u <= 0) continue; n++;
      x.save(); x.translate(R + 60 + c * 64, 340 + r * 62); x.scale(u * .9, u * .9); calcIcon(0, 0, 1, cols[i % cols.length]); x.restore(); }
    var b = pop(fadeIn(lt, 4.4, .5)); if (b > 0) { x.save(); x.globalAlpha = Math.min(1, b); box(R + 640, 360, 210, 150, 20, IND);
      txt('250+', R + 745, 418, 54, '#fff', 800, 'center'); txt('calculators · free', R + 745, 470, 17, '#e0e7ff', 700, 'center'); x.restore(); }
  },
  function browse(lt, T) {
    box(R + 10, 84, 850, 480, 18, '#fff', '#dfe6f0', 2);
    var typed = 'egfr'.slice(0, Math.max(0, Math.min(4, Math.floor((lt - .5) / .2))));
    box(R + 40, 110, 790, 50, 25, '#f8fafc', IND2, 2.5); txt('⌕', R + 66, 135, 22, IND2, 800, 'center'); txt(typed || 'Search calculators', R + 88, 135, 18, typed ? INK : '#94a3b8', 600);
    if (lt > 1.4 && lt < 4.0) { var res = ['CKD-EPI 2021 eGFR', 'eGFR (cystatin C)', 'Cockcroft–Gault CrCl']; res.forEach(function (r2, i) { var u = ease(fadeIn(lt, 1.4 + i * .15, .3));
      x.save(); x.globalAlpha = u; box(R + 40, 172 + i * 46, 790, 40, 10, i === 0 ? '#eef2ff' : '#fff', '#e2e8f0', 1.5); calcIcon(R + 64, 192 + i * 46, .55, '#1a6b72'); txt(r2, R + 88, 192 + i * 46, 16, INK, 700); x.restore(); }); }
    var g = ease(fadeIn(lt, 3.8, .4)); if (g > 0) { x.save(); x.globalAlpha = g; txt('23 categories', R + 40, 196, 18, NAVY, 800);
      CATS.forEach(function (c, i) { var u = pop(fadeIn(lt, 4.0 + i * .18, .35)); if (u <= 0) return; var col = i % 2, row = Math.floor(i / 2);
        x.save(); x.translate(R + 40 + col * 400, 226 + row * 74); x.scale(1, u); box(0, 0, 384, 60, 12, '#fff', c[1], 2.5); box(0, 0, 10, 60, 5, c[1]); calcIcon(36, 30, .6, c[1]); txt(c[0], 62, 30, 15.5, INK, 800); x.restore(); });
      x.restore(); }
  },
  function cardScene(lt, T) {
    card(R + 10, 84, 520, 470, 'CKD-EPI 2021 eGFR');
    txt('Units', R + 32, 140, 14, '#475569', 700); var si = lt > 3.2 && lt < 4.6; box(R + 90, 126, 90, 28, 14, si ? '#f1f5f9' : TEAL); txt('mg/dL', R + 135, 140, 13, si ? '#475569' : '#fff', 800, 'center');
    box(R + 186, 126, 90, 28, 14, si ? TEAL : '#f1f5f9'); txt('µmol/L', R + 231, 140, 13, si ? '#fff' : '#475569', 800, 'center');
    var v = [fadeIn(lt, .6, .2) > .5, fadeIn(lt, 1.2, .2) > .5, fadeIn(lt, 1.8, .2) > .5];
    field(R + 32, 176, 220, 'Age (years)', v[0] ? '62' : '', false); field(R + 272, 176, 236, 'Sex', v[1] ? 'Female' : '', false);
    field(R + 32, 252, 476, 'Serum creatinine', v[2] ? (si ? '124 µmol/L' : '1.4 mg/dL') : '', false);
    var r = ease(fadeIn(lt, 2.2, .5)); if (r > 0) { x.save(); x.globalAlpha = r; box(R + 32, 336, 476, 150, 14, '#ecfeff', TEAL, 2);
      txt('eGFR', R + 54, 366, 15, DTEAL, 800); txt('43', R + 54, 420, 60, DTEAL, 800); txt('mL/min/1.73 m²', R + 140, 432, 17, '#334155', 700);
      chip(R + 360, 404, 'Stage G3b', '#0e4a50', '#fff', 15, 34); x.restore(); }
    var t = ease(fadeIn(lt, 4.4, .5)); if (t > 0) { x.save(); x.globalAlpha = t; box(R + 560, 180, 300, 200, 16, '#fff', '#dfe6f0', 2);
      txt('Result at once', R + 584, 214, 18, NAVY, 800); txt('No "Calculate" button:', R + 584, 250, 15, '#475569', 600); txt('it updates as you type.', R + 584, 274, 15, '#475569', 600);
      txt('Tabular numbers, one', R + 584, 316, 15, '#475569', 600); txt('Units row per calculator.', R + 584, 340, 15, '#475569', 600); x.restore(); }
  },
  function sample(lt, T) {
    card(R + 10, 84, 600, 470, 'Kidney Failure Risk Equation (KFRE)');
    var on = lt > 1.6 && lt < 5.6, pr = lt > 1.4 && lt < 1.7, cl = lt > 5.4 && lt < 5.7;
    box(R + 32, 112 + 0, 0, 0, 0);
    var b1 = on ? '#b45309' : IND2; box(R + 380, 114 + (pr ? 2 : 0), 210, 40, 20, on ? '#fff7ed' : IND2, on ? '#b45309' : IND2, 2);
    txt(on ? 'Clear sample' : 'Sample data', R + 485, 134 + (pr ? 2 : 0), 15, on ? '#9a3412' : '#fff', 800, 'center');
    field(R + 32, 176, 260, 'Age (years)', on ? '58' : '', on); field(R + 312, 176, 276, 'Sex', on ? 'Male' : '', on);
    field(R + 32, 252, 260, 'eGFR', on ? '28' : '', on); field(R + 312, 252, 276, 'Urine ACR (mg/g)', on ? '450' : '', on);
    if (on) { box(R + 32, 340, 556, 44, 10, '#fff7e6', '#f0c674', 1.5); txt('Sample values are amber, and never saved as patient values.', R + 48, 362, 14.5, '#6b4200', 700); }
    var c = lt > 5.6 ? ease(fadeIn(lt, 5.6, .4)) : 0; if (c > 0) { x.save(); x.globalAlpha = c; box(R + 32, 340, 556, 44, 10, '#ecfeff', TEAL, 1.5); txt('Your own values are back.', R + 48, 362, 15, DTEAL, 800); x.restore(); }
    if (pr || cl) { x.strokeStyle = 'rgba(55,48,163,.6)'; x.lineWidth = 4; x.beginPath(); x.arc(R + 485, 134, 30, 0, Math.PI * 2); x.stroke(); }
  },
  function handoff(lt, T) {
    var a = pop(fadeIn(lt, .3, .5)); x.save(); x.globalAlpha = Math.min(1, a); box(R + 260, 86, 380, 90, 45, IND);
    txt('Age 62  ·  58 kg  ·  Cr 1.4 mg/dL', R + 450, 131, 19, '#fff', 800, 'center'); x.restore();
    var cards = [['Cockcroft–Gault', [['Age', '62'], ['Weight', '58 kg'], ['Creatinine', '1.4']]], ['CKD-EPI 2021', [['Age', '62'], ['Creatinine', '1.4'], ['Sex', '—']]], ['Body surface area', [['Weight', '58 kg'], ['Height', '—']]]];
    cards.forEach(function (c, i) { var X = R + 10 + i * 290, u = ease(fadeIn(lt, 1.4 + i * .5, .5)); if (u <= 0) return;

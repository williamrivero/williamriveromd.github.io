<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b23b3b"/></marker><marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1e2e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="92" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#0f1e2e" text-anchor="start">Where chemotherapy injures the nephron</text><text x="64" y="136" font-family="Inter, sans-serif" font-size="26" font-weight="500" fill="#475569" text-anchor="start">Lesion pattern predicts the clinical picture</text><circle cx="300" cy="560" r="110" fill="#f4f7fb" stroke="#7d97b8" stroke-width="4"/><circle cx="270" cy="530" r="34" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/><circle cx="330" cy="526" r="30" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/><circle cx="340" cy="590" r="32" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/><circle cx="270" cy="596" r="30" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/><path d="M410 560 C560 560 600 470 720 470 C860 470 880 640 1020 640 C1160 640 1180 520 1320 520 L1480 520" fill="none" stroke="#9fb3cf" stroke-width="44" stroke-linecap="round"/><path d="M410 560 C560 560 600 470 720 470 C860 470 880 640 1020 640 C1160 640 1180 520 1320 520 L1480 520" fill="none" stroke="#eef4fb" stroke-width="30" stroke-linecap="round"/><g transform="translate(1050 638) rotate(20)"><path d="M-12 0 L0 -10 L12 0 L0 10z" fill="#b8860b"/></g><g transform="translate(1090 630) rotate(-30)"><path d="M-12 0 L0 -10 L12 0 L0 10z" fill="#b8860b"/></g><g transform="translate(1130 616) rotate(60)"><path d="M-12 0 L0 -10 L12 0 L0 10z" fill="#b8860b"/></g><g transform="translate(1190 574) rotate(15)"><path d="M-12 0 L0 -10 L12 0 L0 10z" fill="#b8860b"/></g><circle cx="820" cy="700" r="9" fill="#4b3280" opacity=".7"/><circle cx="860" cy="735" r="9" fill="#4b3280" opacity=".7"/><circle cx="900" cy="705" r="9" fill="#4b3280" opacity=".7"/><circle cx="940" cy="740" r="9" fill="#4b3280" opacity=".7"/><circle cx="980" cy="712" r="9" fill="#4b3280" opacity=".7"/><rect x="64" y="720" width="400" height="172" rx="18" fill="#fbe9e9" stroke="#b23b3b" stroke-width="3"/><text x="86" y="764" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#b23b3b" text-anchor="start">Vessel lining (TMA)</text><text x="86" y="804" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Gemcitabine, mitomycin C</text><text x="86" y="837" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Hypertension, hematuria,</text><text x="86" y="870" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">proteinuria, hemolysis</text><line x1="264" y1="720" x2="290" y2="670" stroke="#b23b3b" stroke-width="3" stroke-dasharray="8 6"/><rect x="520" y="190" width="440" height="206" rx="18" fill="#e6f2ef" stroke="#1a6b72" stroke-width="3"/><text x="542" y="234" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#1a6b72" text-anchor="start">Proximal tubule (ATI)</text><text x="542" y="274" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Cisplatin, ifosfamide,</text><text x="542" y="307" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">melphalan, pemetrexed</text><text x="542" y="340" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Creatinine rise, Mg and K</text><text x="542" y="373" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">wasting, Fanconi syndrome</text><line x1="720" y1="396" x2="720" y2="450" stroke="#1a6b72" stroke-width="3" stroke-dasharray="8 6"/><rect x="520" y="780" width="460" height="138" rx="18" fill="#efeaf7" stroke="#4b3280" stroke-width="3"/><text x="542" y="824" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#4b3280" text-anchor="start">Interstitium</text><text x="542" y="864" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">MTX, pemetrexed: nephritis</text><text x="542" y="897" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Pemetrexed: chronic fibrosis</text><line x1="900" y1="780" x2="900" y2="748" stroke="#4b3280" stroke-width="3" stroke-dasharray="8 6"/><rect x="1100" y="700" width="420" height="172" rx="18" fill="#fdf3df" stroke="#b8860b" stroke-width="3"/><text x="1122" y="744" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#b8860b" text-anchor="start">Tubular lumen (crystals)</text><text x="1122" y="784" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">High-dose MTX</text><text x="1122" y="817" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Nonoliguric AKI,</text><text x="1122" y="850" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">delayed drug clearance</text><line x1="1240" y1="700" x2="1150" y2="650" stroke="#b8860b" stroke-width="3" stroke-dasharray="8 6"/><text x="300" y="428" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="middle">Glomerulus</text><text x="1510" y="528" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#334155" text-anchor="start">to urine</text><rect x="1100" y="190" width="620" height="150" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="1124" y="236" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Not covered by ADQI 34: checkpoint</text><text x="1124" y="267" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">inhibitors (interstitial nephritis) and</text><text x="1124" y="299" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">VEGF inhibitors (TMA, proteinuria)</text><text x="64" y="1000" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#6b7280" text-anchor="start">Original schematic based on the pattern categories in ADQI 34 (Lentini et al., Kidney International 2026).</text><text x="1756" y="1000" font-family="Inter, sans-serif" font-size="18" font-weight="500" fill="#6b7280" text-anchor="end">© renalcarematters.com</text></svg>
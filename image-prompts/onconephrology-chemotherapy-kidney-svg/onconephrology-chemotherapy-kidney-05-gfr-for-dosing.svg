<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b23b3b"/></marker><marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1e2e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="92" font-family="Inter, sans-serif" font-size="42" font-weight="700" fill="#0f1e2e" text-anchor="start">Choosing a kidney-function number for anticancer dosing</text><text x="64" y="136" font-family="Inter, sans-serif" font-size="26" font-weight="500" fill="#475569" text-anchor="start">Aligned with KDIGO 2024 and ADDIKD 2025</text><rect x="64" y="200" width="400" height="300" rx="22" fill="#fbe9e9" stroke="#b23b3b" stroke-width="3"/><text x="88" y="252" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#b23b3b" text-anchor="start">Is kidney function stable?</text><text x="88" y="310" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Yes: continue to the right</text><text x="88" y="344" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">No (evolving AKI): use kinetic</text><text x="88" y="378" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">eGFR and clinical judgment</text><rect x="480" y="200" width="400" height="300" rx="22" fill="#e6f2ef" stroke="#1a6b72" stroke-width="3"/><text x="504" y="252" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#1a6b72" text-anchor="start">Start: CKD-EPI eGFR</text><text x="504" y="310" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">From creatinine</text><text x="504" y="344" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">(not Cockcroft-Gault CrCl</text><text x="504" y="378" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">for new assessments)</text><line x1="884" y1="350" x2="892" y2="350" stroke="#1a6b72" stroke-width="5" marker-end="url(#ah)"/><rect x="896" y="200" width="400" height="300" rx="22" fill="#fdf3df" stroke="#b8860b" stroke-width="3"/><text x="920" y="252" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#b8860b" text-anchor="start">Creatinine unreliable?</text><text x="920" y="310" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">Low muscle, amputation,</text><text x="920" y="344" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">cachexia: add cystatin C</text><text x="920" y="378" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">(eGFRcr-cys)</text><line x1="1300" y1="350" x2="1308" y2="350" stroke="#b8860b" stroke-width="5" marker-end="url(#ah)"/><rect x="1312" y="200" width="400" height="300" rx="22" fill="#efeaf7" stroke="#4b3280" stroke-width="3"/><text x="1336" y="252" font-family="Inter, sans-serif" font-size="25" font-weight="700" fill="#4b3280" text-anchor="start">High-stakes dose?</text><text x="1336" y="310" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">HD-MTX, high-dose cisplatin,</text><text x="1336" y="344" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">curative carboplatin, extremes</text><text x="1336" y="378" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start">of body size: measure GFR</text><line x1="464" y1="350" x2="476" y2="350" stroke="#b23b3b" stroke-width="5" marker-end="url(#ah)"/><rect x="64" y="560" width="1664" height="190" rx="22" fill="#ffffff" stroke="#0f1e2e" stroke-width="3"/><text x="96" y="614" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#0f1e2e" text-anchor="start">Then convert for dosing (de-index):</text><text x="96" y="668" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#1a6b72" text-anchor="start">Absolute GFR (mL/min) = eGFR (mL/min/1.73 m²) × BSA ÷ 1.73</text><text x="96" y="716" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#334155" text-anchor="start">Carboplatin (Calvert): dose = target AUC × (GFR + 25); cap estimated GFR at 125 mL/min</text><rect x="64" y="790" width="1664" height="120" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="896" y="838" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#0f1e2e" text-anchor="middle">Cystatin C-based eGFR can read falsely low with cancer, inflammation, and steroids;</text><text x="896" y="874" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#0f1e2e" text-anchor="middle">when creatinine and cystatin C disagree and the decision matters, measure GFR.</text><text x="1756" y="996" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#6b7280" text-anchor="end">© renalcarematters.com</text></svg>
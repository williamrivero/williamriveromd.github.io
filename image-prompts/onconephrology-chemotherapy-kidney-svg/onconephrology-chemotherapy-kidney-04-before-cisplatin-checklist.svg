<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b23b3b"/></marker><marker id="ahn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f1e2e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="92" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="#0f1e2e" text-anchor="start">Before a nephrotoxic chemotherapy cycle</text><text x="64" y="136" font-family="Inter, sans-serif" font-size="26" font-weight="500" fill="#475569" text-anchor="start">Five checks, every cycle</text><rect x="64" y="190" width="316" height="520" rx="22" fill="#ffffff" stroke="#1a6b72" stroke-width="3"/><circle cx="222" cy="260" r="36" fill="#1a6b72"/><text x="222" y="273" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="222" y="350" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">Kidney</text><text x="222" y="382" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">function method</text><text x="86" y="470" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Stable? Start with eGFR</text><text x="86" y="503" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Low muscle: add cystatin C</text><text x="86" y="536" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">High stakes: measure GFR</text><text x="86" y="569" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Dose on mL/min (de-index)</text><line x1="382" y1="450" x2="400" y2="450" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="402" y="190" width="316" height="520" rx="22" fill="#ffffff" stroke="#1f7a4d" stroke-width="3"/><circle cx="560" cy="260" r="36" fill="#1f7a4d"/><text x="560" y="273" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="560" y="350" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">Magnesium</text><text x="560" y="382" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">and potassium</text><text x="424" y="470" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Check and correct</text><text x="424" y="503" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">before the dose</text><text x="424" y="536" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">IV magnesium with</text><text x="424" y="569" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">cisplatin hydration</text><line x1="720" y1="450" x2="738" y2="450" stroke="#1f7a4d" stroke-width="4" marker-end="url(#ah)"/><rect x="740" y="190" width="316" height="520" rx="22" fill="#ffffff" stroke="#2563a8" stroke-width="3"/><circle cx="898" cy="260" r="36" fill="#2563a8"/><text x="898" y="273" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="898" y="350" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">Hydration plan</text><text x="762" y="470" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">IV fluid before and after</text><text x="762" y="503" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Alkaline urine for HD-MTX</text><text x="762" y="536" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Respect heart failure</text><text x="762" y="569" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">and dialysis fluid limits</text><line x1="1058" y1="450" x2="1076" y2="450" stroke="#2563a8" stroke-width="4" marker-end="url(#ah)"/><rect x="1078" y="190" width="316" height="520" rx="22" fill="#ffffff" stroke="#b8860b" stroke-width="3"/><circle cx="1236" cy="260" r="36" fill="#b8860b"/><text x="1236" y="273" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="1236" y="350" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">Nephrotoxin</text><text x="1236" y="382" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">review</text><text x="1100" y="470" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Stop NSAIDs</text><text x="1100" y="503" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Review PPI, TMP-SMX,</text><text x="1100" y="536" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">penicillins, contrast,</text><text x="1100" y="569" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">aminoglycosides, herbals</text><line x1="1396" y1="450" x2="1414" y2="450" stroke="#b8860b" stroke-width="4" marker-end="url(#ah)"/><rect x="1416" y="190" width="316" height="520" rx="22" fill="#ffffff" stroke="#4b3280" stroke-width="3"/><circle cx="1574" cy="260" r="36" fill="#4b3280"/><text x="1574" y="273" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="1574" y="350" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">Monitoring</text><text x="1574" y="382" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0f1e2e" text-anchor="middle">schedule</text><text x="1438" y="470" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">Creatinine, electrolytes,</text><text x="1438" y="503" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">urine every cycle</text><text x="1438" y="536" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">MTX levels for HD-MTX</text><text x="1438" y="569" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#334155" text-anchor="start">BP, hemolysis for TMA drugs</text><rect x="64" y="760" width="1664" height="110" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="896" y="808" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#0f1e2e" text-anchor="middle">If creatinine rises: look for dehydration, obstruction, and other drugs first;</text><text x="896" y="844" font-family="Inter, sans-serif" font-size="24" font-weight="600" fill="#0f1e2e" text-anchor="middle">then delay, reduce, substitute, or rescue, as a shared oncology–nephrology decision.</text><text x="1756" y="996" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#6b7280" text-anchor="end">© renalcarematters.com</text></svg>
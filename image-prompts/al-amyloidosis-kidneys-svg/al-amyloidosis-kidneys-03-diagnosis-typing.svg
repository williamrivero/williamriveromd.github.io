<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="92" font-family="Inter, 'Inter Display', sans-serif" font-size="46" font-weight="700" fill="#0f1e2e" text-anchor="start" >Confirming AL amyloidosis: three separate answers</text><text x="64" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="26" font-weight="500" fill="#475569" text-anchor="start" >A monoclonal protein answers only the third question</text><rect x="64" y="190" width="512" height="560" rx="26" fill="#eef3fa" stroke="#7d97b8" stroke-width="2"/><circle cx="124" cy="250" r="30" fill="#7d97b8"/><text x="124" y="260" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="168" y="262" font-family="Inter, 'Inter Display', sans-serif" font-size="27" font-weight="700" fill="#0f1e2e" text-anchor="start" >Is there amyloid in tissue?</text><text x="104" y="340" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#4b6386" text-anchor="start" >Test</text><text x="104" y="380" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Congo red stain</text><text x="104" y="414" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Apple-green birefringence</text><text x="104" y="449" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >under polarized light</text><line x1="104" y1="520" x2="536" y2="520" stroke="#7d97b8" stroke-width="2" stroke-dasharray="6 6"/><text x="104" y="566" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#4b6386" text-anchor="start" >Why it matters</text><text x="104" y="606" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Fat pad + bone marrow</text><text x="104" y="640" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >in most people; organ</text><text x="104" y="675" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >biopsy when needed</text><rect x="640" y="190" width="512" height="560" rx="26" fill="#fdf3df" stroke="#b8860b" stroke-width="2"/><circle cx="700" cy="250" r="30" fill="#b8860b"/><text x="700" y="260" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="744" y="262" font-family="Inter, 'Inter Display', sans-serif" font-size="27" font-weight="700" fill="#0f1e2e" text-anchor="start" >Which protein is it?</text><text x="680" y="340" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#b8860b" text-anchor="start" >Test</text><text x="680" y="380" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Typing: laser-capture mass</text><text x="680" y="414" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >spectrometry (preferred) or</text><text x="680" y="449" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >expert immunostaining</text><line x1="680" y1="520" x2="1112" y2="520" stroke="#b8860b" stroke-width="2" stroke-dasharray="6 6"/><text x="680" y="566" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#b8860b" text-anchor="start" >Why it matters</text><text x="680" y="606" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Separates AL from AA,</text><text x="680" y="640" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >ATTR, LECT2, fibrinogen,</text><text x="680" y="675" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >and other forms</text><rect x="1216" y="190" width="512" height="560" rx="26" fill="#e6f2ef" stroke="#1a6b72" stroke-width="2"/><circle cx="1276" cy="250" r="30" fill="#1a6b72"/><text x="1276" y="260" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="1320" y="262" font-family="Inter, 'Inter Display', sans-serif" font-size="27" font-weight="700" fill="#0f1e2e" text-anchor="start" >Is there a plasma-cell clone?</text><text x="1256" y="340" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#1a6b72" text-anchor="start" >Test</text><text x="1256" y="380" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Serum + urine immunofixation</text><text x="1256" y="414" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Serum free light chains</text><text x="1256" y="449" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Bone-marrow examination</text><line x1="1256" y1="520" x2="1688" y2="520" stroke="#1a6b72" stroke-width="2" stroke-dasharray="6 6"/><text x="1256" y="566" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#1a6b72" text-anchor="start" >Why it matters</text><text x="1256" y="606" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >Finds the source that</text><text x="1256" y="640" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#0f1e2e" text-anchor="start" >treatment will target</text><rect x="400" y="800" width="992" height="92" rx="20" fill="#e8f5ec" stroke="#1f7a4d" stroke-width="3"/><text x="896" y="856" font-family="Inter, 'Inter Display', sans-serif" font-size="28" font-weight="700" fill="#0f1e2e" text-anchor="middle" >AL amyloidosis is confirmed only when all three agree</text><line x1="320" y1="754" x2="464" y2="796" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><line x1="896" y1="754" x2="896" y2="796" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><line x1="1472" y1="754" x2="1328" y2="796" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><text x="64" y="970" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#6b7280" text-anchor="start" >Bone scintigraphy is not used to diagnose AL cardiac amyloidosis when a monoclonal protein is present (ASH 2026).</text><text x="1756" y="996" font-family="Inter, 'Inter Display', sans-serif" font-size="20" fill="#6b7280" text-anchor="end">© renalcarematters.com</text></svg>
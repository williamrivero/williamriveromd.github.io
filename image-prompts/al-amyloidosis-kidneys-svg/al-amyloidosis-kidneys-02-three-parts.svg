 font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="600" fill="#334155" text-anchor="middle" >Protein held in</text><path d="M1490 540 A70 70 0 0 1 1630 540" fill="none" stroke="#e2e8f0" stroke-width="14" stroke-linecap="round"/><line x1="1560" y1="540" x2="1595" y2="491" stroke="#1a6b72" stroke-width="6" stroke-linecap="round"/><circle cx="1560" cy="540" r="8" fill="#1a6b72"/><text x="1560" y="580" font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="600" fill="#334155" text-anchor="middle" >Filtering out</text><line x1="580" y1="470" x2="630" y2="470" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><line x1="1156" y1="470" x2="1206" y2="470" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="64" y="830" width="512" height="84" rx="18" fill="#fbe9e9" stroke="#b23b3b" stroke-width="2"/><text x="320" y="882" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="700" fill="#0f1e2e" text-anchor="middle" >Treatment stops new light chains</text><line x1="584" y1="872" x2="632" y2="872" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="640" y="830" width="512" height="84" rx="18" fill="#fdf3df" stroke="#b8860b" stroke-width="2"/><text x="896" y="882" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="700" fill="#0f1e2e" text-anchor="middle" >Deposits shrink slowly, if at all</text><line x1="1160" y1="872" x2="1208" y2="872" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="1216" y="830" width="512" height="84" rx="18" fill="#e6f2ef" stroke="#1f7a4d" stroke-width="2"/><text x="1472" y="882" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="700" fill="#0f1e2e" text-anchor="middle" >Function may recover, often partly</text><text x="64" y="976" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#6b7280" text-anchor="start" >Schematic for teaching; not drawn fro
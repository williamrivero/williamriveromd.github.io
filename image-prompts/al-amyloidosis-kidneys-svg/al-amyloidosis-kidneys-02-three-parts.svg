<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="92" font-family="Inter, 'Inter Display', sans-serif" font-size="46" font-weight="700" fill="#0f1e2e" text-anchor="start" >Three parts of recovery in AL amyloidosis</text><text x="64" y="138" font-family="Inter, 'Inter Display', sans-serif" font-size="26" font-weight="500" fill="#475569" text-anchor="start" >Each part moves on its own clock</text><rect x="64" y="180" width="512" height="600" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/><circle cx="112" cy="232" r="26" fill="#b23b3b"/><text x="112" y="241" font-family="Inter, 'Inter Display', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="152" y="242" font-family="Inter, 'Inter Display', sans-serif" font-size="27" font-weight="700" fill="#0f1e2e" text-anchor="start" >Light-chain production</text><text x="104" y="640" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start" >Plasma-cell clone in the marrow</text><text x="104" y="671" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start" >Measured in blood: free light</text><text x="104" y="703" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start" >chains, immunofixation</text><rect x="104" y="712" width="432" height="48" rx="24" fill="#fbe9e9" stroke="#b23b3b" stroke-width="2"/><text x="320" y="744" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="600" fill="#0f1e2e" text-anchor="middle" >Weeks to months</text><rect x="640" y="180" width="512" height="600" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/><circle cx="688" cy="232" r="26" fill="#b8860b"/><text x="688" y="241" font-family="Inter, 'Inter Display', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="728" y="242" font-family="Inter, 'Inter Display', sans-serif" font-size="27" font-weight="700" fill="#0f1e2e" text-anchor="start" >Deposits already in the kidney</text><text x="680" y="640" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start" >Amyloid fibers in the filter wall</text><text x="680" y="671" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start" >Cleared slowly: macrophages and</text><text x="680" y="703" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start" >processes not fully understood</text><rect x="680" y="712" width="432" height="48" rx="24" fill="#fdf3df" stroke="#b8860b" stroke-width="2"/><text x="896" y="744" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="600" fill="#0f1e2e" text-anchor="middle" >Months to years</text><rect x="1216" y="180" width="512" height="600" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/><circle cx="1264" cy="232" r="26" fill="#1a6b72"/><text x="1264" y="241" font-family="Inter, 'Inter Display', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="1304" y="242" font-family="Inter, 'Inter Display', sans-serif" font-size="27" font-weight="700" fill="#0f1e2e" text-anchor="start" >Kidney function</text><text x="1256" y="640" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start" >Holding protein in, filtering out</text><text x="1256" y="671" font-family="Inter, 'Inter Di
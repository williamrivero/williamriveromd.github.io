<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="96" font-family="Inter, 'Inter Display', sans-serif" font-size="40" font-weight="700" fill="#0f1e2e" text-anchor="start" >When blood, urine, and eGFR disagree</text><text x="64" y="140" font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="500" fill="#475569" text-anchor="start" >Clinician assessment workflow (practice proposal)</text><rect x="80" y="190" width="864" height="168" rx="22" fill="#e6f2ef" stroke="#1a6b72" stroke-width="2.5"/><circle cx="146" cy="274" r="32" fill="#1a6b72"/><text x="146" y="285" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text><text x="204" y="252" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#0f1e2e" text-anchor="start" >Confirm comparability</text><text x="204" y="294" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >Same test, units, complete collection, same eGFR</text><text x="204" y="324" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >equation, steady state</text><line x1="512" y1="362" x2="512" y2="394" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="400" width="864" height="168" rx="22" fill="#fdf3df" stroke="#b8860b" stroke-width="2.5"/><circle cx="146" cy="484" r="32" fill="#b8860b"/><text x="146" y="495" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text><text x="204" y="462" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#0f1e2e" text-anchor="start" >Exclude reversible causes</text><text x="204" y="504" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >Over-diuresis, new RAAS or SGLT2 drugs, hypotension,</text><text x="204" y="534" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >NSAIDs, contrast, sepsis</text><line x1="512" y1="572" x2="512" y2="604" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="610" width="864" height="168" rx="22" fill="#fbe9e9" stroke="#b23b3b" stroke-width="2.5"/><circle cx="146" cy="694" r="32" fill="#b23b3b"/><text x="146" y="705" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text><text x="204" y="672" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#0f1e2e" text-anchor="start" >Re-examine the clone</text><text x="204" y="714" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >Rising dFLC or new immunofixation: hematology review</text><line x1="512" y1="782" x2="512" y2="814" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="820" width="864" height="168" rx="22" fill="#efe9fa" stroke="#6f4bb8" stroke-width="2.5"/><circle cx="146" cy="904" r="32" fill="#6f4bb8"/><text x="146" y="915" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text><text x="204" y="882" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#0f1e2e" text-anchor="start" >Assess the heart</text><text x="204" y="924" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >NT-proBNP and troponin trends with eGFR;</text><text x="204" y="954" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >echocardiography</text><line x1="512" y1="992" x2="512" y2="1024" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="1030" width="864" height="168" rx="22" fill="#eef3fa" stroke="#4b6386" stroke-width="2.5"/><circle cx="146" cy="1114" r="32" fill="#4b6386"/><text x="146" y="1125" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text><text x="204" y="1092" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#0f1e2e" text-anchor="start" >Reconsider the kidney diagnosis</text><text x="204" y="1134" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >Drug toxicity, renal vein thrombosis, obstruction,</text><text x="204" y="1164" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >second process</text><line x1="512" y1="1202" x2="512" y2="1234" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="80" y="1240" width="864" height="168" rx="22" fill="#e8f5ec" stroke="#1f7a4d" stroke-width="2.5"/><circle cx="146" cy="1324" r="32" fill="#1f7a4d"/><text x="146" y="1335" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text><text x="204" y="1302" font-family="Inter, 'Inter Display', sans-serif" font-size="30" font-weight="700" fill="#0f1e2e" text-anchor="start" >Report each domain separately</text><text x="204" y="1344" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >Hematologic, renal, cardiac status with dates in the</text><text x="204" y="1374" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="500" fill="#334155" text-anchor="start" >letter</text><text x="512" y="1470" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="600" fill="#b23b3b" text-anchor="middle" >Falling urine protein with falling eGFR can mean nephron loss, not repair.</text><text x="512" y="1508" font-family="Inter, 'Inter Display', sans-serif" font-size="20" fill="#6b7280" text-anchor="middle">© renalcarematters.com</text></svg>
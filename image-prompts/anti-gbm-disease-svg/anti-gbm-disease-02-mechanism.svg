<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="88" font-family="Inter, 'Inter Display', sans-serif" font-size="44" font-weight="700" fill="#0f1e2e" text-anchor="start">How anti-GBM disease injures the kidney and lung</text><text x="64" y="132" font-family="Inter, 'Inter Display', sans-serif" font-size="26" font-weight="500" fill="#475569" text-anchor="start">One hidden target, two organs, one race against time</text><rect x="64" y="170" width="380" height="560" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/><text x="254" y="214" font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="700" fill="#0f1e2e" text-anchor="middle">Two filters share one mesh</text><g transform="translate(180 360) scale(0.75)"><path d="M-10 -120 C-110 -130 -150 -40 -140 20 C-130 100 -60 140 0 120 C40 108 30 60 10 40 C-10 20 -10 -20 10 -40 C30 -60 50 -110 -10 -120z" fill="#e9a9a0" stroke="#b86f66" stroke-width="4"/><path d="M-14 -88 C-82 -90 -108 -30 -100 16 C-94 66 -50 96 -10 88" fill="none" stroke="#f7d9d4" stroke-width="10" stroke-linecap="round"/></g><g transform="translate(340 360) scale(0.62)"><path d="M0 -110 L0 -30 M0 -30 C-10 -20 -30 -14 -44 -6 M0 -30 C10 -20 30 -14 44 -6" stroke="#9fb3cf" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M-20 -60 C-70 -90 -130 -40 -130 40 C-130 110 -90 130 -40 120 C-20 116 -16 90 -18 60 Z" fill="#f1c4c4" stroke="#b97b7b" stroke-width="4"/><path d="M20 -60 C70 -90 130 -40 130 40 C130 110 90 130 40 120 C20 116 16 90 18 60 Z" fill="#f1c4c4" stroke="#b97b7b" stroke-width="4"/><circle cx="-80" cy="30" r="12" fill="#b23b3b" opacity="0.8"/><circle cx="-60" cy="70" r="9" fill="#b23b3b" opacity="0.8"/><circle cx="-95" cy="75" r="8" fill="#b23b3b" opacity="0.8"/><circle cx="75" cy="40" r="11" fill="#b23b3b" opacity="0.8"/><circle cx="90" cy="80" r="8" fill="#b23b3b" opacity="0.8"/><circle cx="60" cy="85" r="7" fill="#b23b3b" opacity="0.8"/></g><text x="254" y="520" font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="500" fill="#334155" text-anchor="middle">Kidney filters (glomeruli)</text><text x="254" y="548" font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="500" fill="#334155" text-anchor="middle">and lung air sacs (alveoli)</text><text x="254" y="577" font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="500" fill="#334155" text-anchor="middle">are lined by basement</text><text x="254" y="605" font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="500" fill="#334155" text-anchor="middle">membrane with the same</text><text x="254" y="634" font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="500" fill="#334155" text-anchor="middle">collagen IV α3 chain</text><rect x="476" y="170" width="400" height="560" rx="24" fill="#eef6f7" stroke="#1a6b72" stroke-width="2"/><text x="676" y="214" font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="700" fill="#0f1e2e" text-anchor="middle">The target is normally hidden</text><circle cx="604" cy="330" r="24" fill="#9fd3d6" stroke="#475569" stroke-width="2"/><circle cx="585" cy="363" r="24" fill="#c8b6ea" stroke="#475569" stroke-width="2"/><circle cx="547" cy="363" r="24" fill="#f3c9a4" stroke="#475569" stroke-width="2"/><circle cx="528" cy="330" r="24" fill="#9fd3d6" stroke="#475569" stroke-width="2"/><circle cx="547" cy="297" r="24" fill="#c8b6ea" stroke="#475569" stroke-width="2"/><circle cx="585" cy="297" r="24" fill="#f3c9a4" stroke="#475569" stroke-width="2"/><circle cx="566" cy="330" r="8" fill="#94a3b8"/><text x="566" y="412" font-family="Inter, 'Inter Display', sans-serif" font-size="19" font-weight="600" fill="#475569" text-anchor="middle">Intact NC1 hexamer</text><circle cx="840" cy="330" r="24" fill="#9fd3d6" stroke="#475569" stroke-width="2"/><circle cx="805" cy="363" r="24" fill="#c8b6ea" stroke="#475569" stroke-width="2"/><circle cx="767" cy="363" r="24" fill="#f3c9a4" stroke="#475569" stroke-width="2"/><circle cx="732" cy="330" r="24" fill="#9fd3d6" stroke="#475569" stroke-width="2"/><circle cx="767" cy="297" r="24" fill="#c8b6ea" stroke="#475569" stroke-width="2"/><circle cx="805" cy="297" r="24" fill="#f3c9a4" stroke="#475569" stroke-width="2"/><circle cx="840" cy="330" r="11" fill="#b23b3b"/><circle cx="732" cy="330" r="11" fill="#b23b3b"/><text x="786" y="412" font-family="Inter, 'Inter Display', sans-serif" font-size="19" font-weight="600" fill="#475569" text-anchor="middle">Hexamer opens</text><line x1="632" y1="330" x2="700" y2="330" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><g transform="translate(840 296) rotate(-40) scale(1.0)"><path d="M-14 -12 L0 0 L14 -12 M0 0 L0 18" stroke="#b23b3b" stroke-width="5" fill="none" stroke-linecap="round"/></g><g transform="translate(732 296) rotate(40) scale(1.0)"><path d="M-14 -12 L0 0 L14 -12 M0 0 L0 18" stroke="#b23b3b" stroke-width="5" fill="none" stroke-linecap="round"/></g><text x="676" y="470" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">Cross-links (sulfilimine bonds)</text><text x="676" y="497" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">normally bury the α3 epitopes</text><text x="676" y="524" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">EA and EB. Once exposed, IgG</text><text x="676" y="551" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">autoantibodies bind them;</text><text x="676" y="578" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">smoking or infection may</text><text x="676" y="606" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">help antibodies reach the lung</text><rect x="908" y="170" width="400" height="560" rx="24" fill="#fbe9e9" stroke="#b23b3b" stroke-width="2"/><text x="1108" y="214" font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="700" fill="#0f1e2e" text-anchor="middle">Inflammation breaks the filter</text><g transform="translate(1010 340) scale(0.8)"><circle r="100" fill="#f4f7fb" stroke="#7d97b8" stroke-width="3"/><circle cx="-24" cy="-20" r="28" fill="#f3d6d6" stroke="#1a6b72" stroke-width="5"/><circle cx="26" cy="-26" r="26" fill="#f3d6d6" stroke="#1a6b72" stroke-width="5"/><circle cx="32" cy="24" r="28" fill="#f3d6d6" stroke="#1a6b72" stroke-width="5"/><circle cx="-20" cy="32" r="26" fill="#f3d6d6" stroke="#1a6b72" stroke-width="5"/><circle cx="2" cy="2" r="20" fill="#f3d6d6" stroke="#1a6b72" stroke-width="5"/></g><text x="1010" y="448" font-family="Inter, 'Inter Display', sans-serif" font-size="19" font-weight="600" fill="#1a6b72" text-anchor="middle">Linear IgG</text><line x1="1092" y1="340" x2="1132" y2="340" stroke="#b23b3b" stroke-width="4" marker-end="url(#ah)"/><g transform="translate(1222 340) scale(0.8)"><circle r="100" fill="#f4f7fb" stroke="#7d97b8" stroke-width="3"/><path d="M-100 0 A100 100 0 0 1 60 -80 A86 86 0 0 0 -84 10 Z" fill="#d9c9f2" stroke="#5b3fa0" stroke-width="3"/><circle cx="-24" cy="-20" r="28" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/><circle cx="26" cy="-26" r="26" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/><circle cx="32" cy="24" r="28" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/><circle cx="-20" cy="32" r="26" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/><circle cx="2" cy="2" r="20" fill="#f3d6d6" stroke="#c98b8b" stroke-width="2.5"/></g><text x="1222" y="448" font-family="Inter, 'Inter Display', sans-serif" font-size="19" font-weight="600" fill="#5b3fa0" text-anchor="middle">Crescent</text><text x="1108" y="500" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">Complement and white cells</text><text x="1108" y="527" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">rupture the capillary wall;</text><text x="1108" y="554" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">blood and fibrin leak into</text><text x="1108" y="581" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">Bowman space; cells pile up</text><text x="1108" y="608" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">as a crescent that scars</text><text x="1108" y="636" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#334155" text-anchor="middle">within days to weeks</text><rect x="1340" y="170" width="388" height="560" rx="24" fill="#e8f5ec" stroke="#1f7a4d" stroke-width="2"/><text x="1534" y="214" font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="700" fill="#0f1e2e" text-anchor="middle">Treatment has three jobs</text><circle cx="1392" cy="270" r="24" fill="#1f7a4d"/><text x="1392" y="279" font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="1430" y="266" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="700" fill="#0f1e2e" text-anchor="start">Remove antibodies</text><text x="1430" y="296" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start">plasma exchange</text><circle cx="1392" cy="410" r="24" fill="#1f7a4d"/><text x="1392" y="419" font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="1430" y="406" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="700" fill="#0f1e2e" text-anchor="start">Stop new antibodies</text><text x="1430" y="436" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start">cyclophosphamide, steroids</text><circle cx="1392" cy="550" r="24" fill="#1f7a4d"/><text x="1392" y="559" font-family="Inter, 'Inter Display', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="1430" y="546" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="700" fill="#0f1e2e" text-anchor="start">Calm the injury</text><text x="1430" y="576" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#475569" text-anchor="start">steroids; support organs</text><text x="1534" y="690" font-family="Inter, 'Inter Display', sans-serif" font-size="19" font-weight="600" fill="#1f7a4d" text-anchor="middle">Started before the crescents</text><text x="1534" y="715" font-family="Inter, 'Inter Display', sans-serif" font-size="19" font-weight="600" fill="#1f7a4d" text-anchor="middle">scar, kidney function can be saved</text><rect x="64" y="780" width="384" height="84" rx="18" fill="#eef6f7" stroke="#1a6b72" stroke-width="2"/><text x="256" y="832" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="700" fill="#0f1e2e" text-anchor="middle">Hidden α3 target exposed</text><line x1="452" y1="822" x2="478" y2="822" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="484" y="780" width="384" height="84" rx="18" fill="#fbe9e9" stroke="#b23b3b" stroke-width="2"/><text x="676" y="832" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="700" fill="#0f1e2e" text-anchor="middle">Antibodies attack kidney ± lung</text><line x1="872" y1="822" x2="898" y2="822" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="904" y="780" width="384" height="84" rx="18" fill="#efe9fa" stroke="#5b3fa0" stroke-width="2"/><text x="1096" y="832" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="700" fill="#0f1e2e" text-anchor="middle">Crescents form within days</text><line x1="1292" y1="822" x2="1318" y2="822" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="1324" y="780" width="384" height="84" rx="18" fill="#e8f5ec" stroke="#1f7a4d" stroke-width="2"/><text x="1516" y="832" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="700" fill="#0f1e2e" text-anchor="middle">Early treatment saves filters</text><text x="64" y="950" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#6b7280" text-anchor="start">Schematic for teaching. NC1, noncollagenous domain 1; EA and EB, the two main antibody-binding regions of α3(IV)NC1.</text><text x="1756" y="996" font-family="Inter, 'Inter Display', sans-serif" font-size="20" fill="#6b7280" text-anchor="end">© renalcarematters.com</text></svg>
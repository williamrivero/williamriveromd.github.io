<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="90" font-family="Inter, 'Inter Display', sans-serif" font-size="44" font-weight="700" fill="#0f1e2e" text-anchor="start">Suspected anti-GBM disease: the first 24 hours</text><text x="64" y="134" font-family="Inter, 'Inter Display', sans-serif" font-size="26" font-weight="500" fill="#475569" text-anchor="start">Do not let the biopsy schedule delay treatment</text><rect x="64" y="180" width="1472" height="176" rx="22" fill="#fbe9e9" stroke="#b23b3b" stroke-width="2.5"/><circle cx="124" cy="268" r="34" fill="#b23b3b"/><text x="124" y="280" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="190" y="242" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#0f1e2e" text-anchor="start">Suspect it</text><text x="190" y="290" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">Rapidly rising creatinine with blood and protein in the urine,</text><text x="190" y="324" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">with or without coughing blood or new lung shadows</text><line x1="800" y1="358" x2="800" y2="390" stroke="#b23b3b" stroke-width="4" marker-end="url(#ah)"/><rect x="64" y="394" width="1472" height="176" rx="22" fill="#eef6f7" stroke="#1a6b72" stroke-width="2.5"/><circle cx="124" cy="482" r="34" fill="#1a6b72"/><text x="124" y="494" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="190" y="456" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#0f1e2e" text-anchor="start">Same-day tests</text><text x="190" y="504" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">Anti-GBM antibody AND ANCA (MPO, PR3) together; urinalysis</text><text x="190" y="538" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">and sediment, creatinine, potassium, CBC; chest X-ray or CT</text><line x1="800" y1="572" x2="800" y2="604" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="64" y="608" width="1472" height="176" rx="22" fill="#fdf3df" stroke="#9a6b00" stroke-width="2.5"/><circle cx="124" cy="696" r="34" fill="#9a6b00"/><text x="124" y="708" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="190" y="670" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#0f1e2e" text-anchor="start">High suspicion? Start now</text><text x="190" y="718" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">Glucocorticoids; plasma exchange if it can start, even before</text><text x="190" y="752" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">results return (KDIGO Practice Point 11.2.1)</text><line x1="800" y1="786" x2="800" y2="818" stroke="#9a6b00" stroke-width="4" marker-end="url(#ah)"/><rect x="64" y="822" width="1472" height="176" rx="22" fill="#eef6f7" stroke="#1a6b72" stroke-width="2.5"/><circle cx="124" cy="910" r="34" fill="#1a6b72"/><text x="124" y="922" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="190" y="884" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#0f1e2e" text-anchor="start">Kidney biopsy, early</text><text x="190" y="932" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">Linear IgG confirms; crescent count and normal glomeruli</text><text x="190" y="966" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">guide prognosis. Add 300-600 mL fresh plasma within 3 days of biopsy</text><line x1="800" y1="1000" x2="800" y2="1032" stroke="#1a6b72" stroke-width="4" marker-end="url(#ah)"/><rect x="64" y="1036" width="1472" height="176" rx="22" fill="#e8f5ec" stroke="#1f7a4d" stroke-width="2.5"/><circle cx="124" cy="1124" r="34" fill="#1f7a4d"/><text x="124" y="1136" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="190" y="1098" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#0f1e2e" text-anchor="start">Full course</text><text x="190" y="1146" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">Daily plasma exchange until antibody negative (about 14 days);</text><text x="190" y="1180" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">oral cyclophosphamide 2-3 months; steroids about 6 months</text><line x1="800" y1="1214" x2="800" y2="1246" stroke="#1f7a4d" stroke-width="4" marker-end="url(#ah)"/><rect x="64" y="1250" width="1472" height="176" rx="22" fill="#efe9fa" stroke="#5b3fa0" stroke-width="2.5"/><circle cx="124" cy="1338" r="34" fill="#5b3fa0"/><text x="124" y="1350" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="190" y="1312" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#0f1e2e" text-anchor="start">Decide on the edge cases</text><text x="190" y="1360" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">Dialysis-dependent + 100% crescents or &gt;50% sclerosis + no lung</text><text x="190" y="1394" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">bleeding: KDIGO exception; consider a short trial or supportive care</text><line x1="800" y1="1428" x2="800" y2="1460" stroke="#5b3fa0" stroke-width="4" marker-end="url(#ah)"/><rect x="64" y="1464" width="1472" height="176" rx="22" fill="#e8edf5" stroke="#0f1e2e" stroke-width="2.5"/><circle cx="124" cy="1552" r="34" fill="#0f1e2e"/><text x="124" y="1564" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="190" y="1526" font-family="Inter, 'Inter Display', sans-serif" font-size="32" font-weight="700" fill="#0f1e2e" text-anchor="start">Follow-up</text><text x="190" y="1574" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">Double-positive: maintenance as for ANCA vasculitis. No smoking.</text><text x="190" y="1608" font-family="Inter, 'Inter Display', sans-serif" font-size="25" font-weight="500" fill="#334155" text-anchor="start">Transplant only after antibodies are negative for 6 months or more</text><text x="64" y="1700" font-family="Inter, 'Inter Display', sans-serif" font-size="21" font-weight="500" fill="#6b7280" text-anchor="start">Summary of KDIGO 2021 Chapter 11 and McAdoo &amp; Pusey (2025). Individualize for each patient.</text><text x="1564" y="1772" font-family="Inter, 'Inter Display', sans-serif" font-size="20" fill="#6b7280" text-anchor="end">© renalcarematters.com</text></svg>
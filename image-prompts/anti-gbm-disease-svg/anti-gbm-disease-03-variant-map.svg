<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="1024" viewBox="0 0 1792 1024"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a6b72"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="64" y="88" font-family="Inter, 'Inter Display', sans-serif" font-size="44" font-weight="700" fill="#0f1e2e" text-anchor="start">Variant forms of anti-GBM disease</text><text x="64" y="132" font-family="Inter, 'Inter Display', sans-serif" font-size="26" font-weight="500" fill="#475569" text-anchor="start">Four groups proposed by Kuang et al. (2026); each changes testing, treatment, or follow-up</text><rect x="64" y="170" width="800" height="350" rx="26" fill="#eef6f7" stroke="#1a6b72" stroke-width="2.5"/><circle cx="116" cy="220" r="28" fill="#1a6b72"/><text x="116" y="230" font-family="Inter, 'Inter Display', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="160" y="231" font-family="Inter, 'Inter Display', sans-serif" font-size="29" font-weight="700" fill="#0f1e2e" text-anchor="start">Overlapping autoimmune disease</text><text x="104" y="290" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">With ANCA vasculitis ("double-positive"):</text><text x="104" y="321" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">about one in three patients</text><text x="104" y="352" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">With membranous nephropathy</text><text x="104" y="383" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">With IgA nephropathy</text><line x1="104" y1="422" x2="824" y2="422" stroke="#1a6b72" stroke-width="2" stroke-dasharray="6 6"/><text x="104" y="462" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="start">Plan long-term follow-up; maintenance</text><text x="104" y="491" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="start">therapy when ANCA is also positive</text><rect x="904" y="170" width="800" height="350" rx="26" fill="#efe9fa" stroke="#5b3fa0" stroke-width="2.5"/><circle cx="956" cy="220" r="28" fill="#5b3fa0"/><text x="956" y="230" font-family="Inter, 'Inter Display', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="1000" y="231" font-family="Inter, 'Inter Display', sans-serif" font-size="29" font-weight="700" fill="#0f1e2e" text-anchor="start">Immunologically distinct</text><text x="944" y="290" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">Alport syndrome after transplant:</text><text x="944" y="321" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">alloantibodies to the α5 chain</text><text x="944" y="352" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">Seronegative or atypical: blood test</text><text x="944" y="383" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">negative, linear IgG on biopsy</text><line x1="944" y1="422" x2="1664" y2="422" stroke="#5b3fa0" stroke-width="2" stroke-dasharray="6 6"/><text x="944" y="462" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="start">Standard blood tests can miss both;</text><text x="944" y="491" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="start">the biopsy and genetics guide care</text><rect x="64" y="550" width="800" height="350" rx="26" fill="#fdf3df" stroke="#9a6b00" stroke-width="2.5"/><circle cx="116" cy="600" r="28" fill="#9a6b00"/><text x="116" y="610" font-family="Inter, 'Inter Display', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="160" y="611" font-family="Inter, 'Inter Display', sans-serif" font-size="29" font-weight="700" fill="#0f1e2e" text-anchor="start">Different clinical pattern</text><text x="104" y="670" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">Relapse in the native kidney (rare;</text><text x="104" y="701" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">often lung bleeding, often smokers)</text><text x="104" y="732" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">Older adults: more ANCA, worse survival</text><text x="104" y="763" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">Normal kidney function, lung-first</text><line x1="104" y1="802" x2="824" y2="802" stroke="#9a6b00" stroke-width="2" stroke-dasharray="6 6"/><text x="104" y="842" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="start">Smoking cessation; balance treatment</text><text x="104" y="871" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="start">intensity against infection risk</text><rect x="904" y="550" width="800" height="350" rx="26" fill="#fbe9e9" stroke="#b23b3b" stroke-width="2.5"/><circle cx="956" cy="600" r="28" fill="#b23b3b"/><text x="956" y="610" font-family="Inter, 'Inter Display', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="1000" y="611" font-family="Inter, 'Inter Display', sans-serif" font-size="29" font-weight="700" fill="#0f1e2e" text-anchor="start">Medication- or trigger-associated</text><text x="944" y="670" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">Alemtuzumab</text><text x="944" y="701" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">Immune checkpoint inhibitors</text><text x="944" y="732" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">Reported after infection epidemics</text><text x="944" y="763" font-family="Inter, 'Inter Display', sans-serif" font-size="23" font-weight="500" fill="#334155" text-anchor="start">and SARS-CoV-2 vaccination</text><line x1="944" y1="802" x2="1664" y2="802" stroke="#b23b3b" stroke-width="2" stroke-dasharray="6 6"/><text x="944" y="842" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="start">Check anti-GBM promptly if kidney</text><text x="944" y="871" font-family="Inter, 'Inter Display', sans-serif" font-size="22" font-weight="700" fill="#0f1e2e" text-anchor="start">function falls on these drugs</text><text x="64" y="950" font-family="Inter, 'Inter Display', sans-serif" font-size="20" font-weight="500" fill="#6b7280" text-anchor="start">ANCA, antineutrophil cytoplasmic antibody. Associations with drugs and vaccines are reported cases; cause has not been proven.</text><text x="1756" y="996" font-family="Inter, 'Inter Display', sans-serif" font-size="20" fill="#6b7280" text-anchor="end">© renalcarematters.com</text></svg>
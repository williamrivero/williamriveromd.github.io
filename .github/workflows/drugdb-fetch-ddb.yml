name: drugdb-fetch-ddb
# Downloads the Dangerous Drugs Board (DDB) schedules and Board Regulations listed in
# tools/drugdb/sources/ddb_urls.txt, converts PDFs to text (OCR fallback for scans), and commits the
# results to tools/drugdb/sources/raw/ddb/ (artifacts are not downloadable from the dev sandbox).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler + tesseract
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
      - name: Fetch sources
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          out=tools/drugdb/sources/raw/ddb
          mkdir -p "$out"
          log=tools/drugdb/sources/ddb-fetch-log.tsv
          printf "name\thttp_code\tbytes\tcontent_type\tretrieved_utc\turl\n" > "$log"
          grep -v '^#' tools/drugdb/sources/ddb_urls.txt | grep '|' | while IFS='|' read -r name url; do
            res=$(curl -sSL --max-time 180 -A "$UA" -o "$out/$name" -w "%{http_code}\t%{size_download}\t%{content_type}" "$url" 2>/dev/null)
            [ -z "$res" ] && res="000\t0\t-"
            printf "%s\t%b\t%s\t%s\n" "$name" "$res" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$url" >> "$log"
            if file "$out/$name" | grep -q PDF; then
              base="$out/${name%.pdf}"
              pdftotext -layout "$out/$name" "$base.txt"
              pdfinfo "$out/$name" > "$base.info.txt" 2>/dev/null
              # scanned PDF (little or no text layer): OCR every page at 300 dpi
              if [ "$(tr -d '[:space:]' < "$base.txt" | wc -c)" -lt 400 ]; then
                tmp=$(mktemp -d)
                pdftoppm -r 300 -gray -png "$out/$name" "$tmp/p"
                : > "$base.ocr.txt"
                for img in $(ls "$tmp"/p-*.png | sort -V); do
                  echo "===== $(basename "$img") =====" >> "$base.ocr.txt"
                  tesseract "$img" - --psm 6 2>/dev/null >> "$base.ocr.txt"
                done
                rm -rf "$tmp"
              fi
            fi
          done
          cat "$log"
          find "$out" -type f -size 0 -delete
          find "$out" -name '*.pdf' -size +20M -delete
          ls -la "$out"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/drugdb/sources
          git commit -m "drugdb: fetch DDB schedules and Board Regulations" || exit 0
          git pull --rebase origin main && git push origin HEAD:main

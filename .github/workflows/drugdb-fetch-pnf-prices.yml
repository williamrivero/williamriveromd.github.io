name: drugdb-fetch-pnf-prices
# Downloads the official PNF / PhilHealth GAMOT / DOH DPRI source documents listed in
# tools/drugdb/sources/pnf_price_urls.txt, converts PDFs to text, and commits the results to
# tools/drugdb/sources/ (artifacts are not downloadable from the dev sandbox).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Fetch sources
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          out=tools/drugdb/sources/raw
          mkdir -p "$out"
          log=tools/drugdb/sources/fetch-log.tsv
          printf "name\thttp_code\tbytes\tcontent_type\tretrieved_utc\turl\n" > "$log"
          grep -v '^#' tools/drugdb/sources/pnf_price_urls.txt | grep '|' | while IFS='|' read -r name url; do
            res=$(curl -sSL --max-time 180 -A "$UA" -o "$out/$name" -w "%{http_code}\t%{size_download}\t%{content_type}" "$url" 2>/dev/null)
            [ -z "$res" ] && res="000\t0\t-"
            printf "%s\t%b\t%s\t%s\n" "$name" "$res" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$url" >> "$log"
            if file "$out/$name" | grep -q PDF; then
              pdftotext -layout "$out/$name" "$out/${name%.pdf}.txt"
              pdfinfo "$out/$name" > "$out/${name%.pdf}.info.txt" 2>/dev/null
            fi
          done
          cat "$log"
          # keep PDFs under 20 MB only; drop failed/empty downloads
          find "$out" -type f -size 0 -delete
          find "$out" -name '*.pdf' -size +20M -delete
          ls -la "$out"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/drugdb/sources
          git commit -m "drugdb: fetch PNF / GAMOT / DPRI source documents" || exit 0
          git pull --rebase origin main && git push origin HEAD:main

name: Regenerate sitemap

# Rebuilds sitemap.xml from the HTML on disk after every content push to
# main, then commits it back if it changed. This keeps the sitemap in
# sync with the guides automatically — no manual maintenance.
#
# Loop prevention: pushes that only touch sitemap.xml (i.e. this
# workflow's own commit) are ignored via paths-ignore, and the commit
# message carries [skip ci] as a second safeguard.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - '.github/**'

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate sitemap.xml
        run: python3 generate_sitemap.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml already in sync — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Regenerate sitemap.xml [skip ci]"
          git push

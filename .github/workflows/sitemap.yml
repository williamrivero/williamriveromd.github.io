name: Regenerate sitemap

# Rebuilds sitemap.xml from the HTML on disk after every content push to
# main, then commits it back if it changed. This keeps the sitemap in
# sync with the guides automatically — no manual maintenance.
#
# Loop prevention: pushes that only touch sitemap.xml (i.e. this
# workflow's own commit) are ignored via paths-ignore, and the commit
# message carries [skip ci] as a second safeguard.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
      - 'guides/search-index.json'
      - '.github/**'

concurrency:
  group: sitemap-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate sitemap.xml
        run: python3 generate_sitemap.py

      - name: Rebuild the guides search index
        run: python3 generate_search_index.py

      - name: Side rail script (fingerprint guide-rail.js, repoint pages)
        run: python3 patch_guide_rail.py

      - name: Calculo (calculators app) files
        run: python3 build_calc_app.py

      - name: Appearance themes (Auto / Light / Dim / Dark bootstrap + Dim CSS)
        run: python3 patch_theme_modes.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap.xml guides/search-index.json && git diff --quiet -- '*.html' && git diff --quiet -- assets/ && [ -z "$(git ls-files --others --exclude-standard assets/)" ]; then
            echo "sitemap.xml and search-index.json already in sync — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml guides/search-index.json 'guides/*.html' guides/calc-app.webmanifest guides/calc-sw.js guides/calc-offline-manifest.json assets/
          git add -A -- '*.html'
          git commit -m "Regenerate sitemap.xml, search index, Calculo app and theme files [skip ci]"
          git push

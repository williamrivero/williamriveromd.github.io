name: drugdb-pages
# Rebuilds the drug database pages (drugs/) from data/drugs/.
# Runs after the Monday label refresh, and whenever drug data or the generator changes on main.
# Only approved renal/summary content renders; pending drafts never appear.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"   # Mondays 03:00 Asia/Manila, one hour after drugdb-labels
  push:
    branches: [main]
    paths:
      - "data/drugs/**"
      - "generate_drug_pages.py"
      - "generate_supplement_pages.py"
      - "tools/drugdb/merge_renal_short.py"
      - "tools/drugdb/build_nephrotox.py"
      - "tools/drugdb/nephrotox_rules.json"
      - "tools/drugdb/build_timing.py"
      - "tools/drugdb/timing_rules.json"
      - "tools/drugdb/interactions.py"
      - "tools/drugdb/interaction_classes.json"
      - "tools/drugdb/pn_products.json"
      - "tools/drugdb/supplement_pages_allowlist.txt"
      - "tools/drugdb/build_related_guides.py"
      - "tools/drugdb/related_guides_overrides.json"
      - "tools/drugdb/related_calculators.json"
      - "guides/*.html"

permissions:
  contents: write

concurrency:
  group: drugdb-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Manila   # page dates must match local (Manila) builds, or CI and local rebuilds flip-flop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Related guides (drug and supplement pages)
        run: python3 tools/drugdb/build_related_guides.py
      - name: Merge approved kidney tiles
        run: python3 tools/drugdb/merge_renal_short.py
      - name: Kidney injury risk tags (verbatim US label quotes)
        # a rule whose quote is gone after a label update is dropped (never shown unsourced) and flagged here
        run: python3 tools/drugdb/build_nephrotox.py || echo "::warning::A kidney injury tag lost its US label quote; see the log and update tools/drugdb/nephrotox_rules.json"
      - name: Medicine timing rules (Med Scheduler)
        run: python3 tools/drugdb/build_timing.py || echo "::warning::A Med Scheduler timing rule lost its US label quote; see the log and update tools/drugdb/timing_rules.json"
      - name: Build food-supplement pages
        run: python3 generate_supplement_pages.py
      - name: Build drug pages
        run: python3 generate_drug_pages.py
      - name: Refresh sitemap
        run: python3 generate_sitemap.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drugs data/drugs/renal data/drugs/supplements/_pages.json data/drugs/related_guides.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No page changes."; exit 0
          fi
          N=$(git diff --cached --name-only -- drugs | wc -l)
          git commit -m "Drug database: rebuild pages ($N files changed)" \
                     -m "Automated rebuild from data/drugs (approved content only)."
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1

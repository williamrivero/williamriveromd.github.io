<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" stroke="#1e2a38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Nephrology & Kidney Disease category sigil: kidney at the centre of a
       multi-organ network (heart, bone, intestine, brain). Decorative line emblem. -->
  <g opacity="0.95">
    <!-- connecting dashed ring through the four satellite centres -->
    <circle cx="512" cy="500" r="350" stroke-dasharray="1 11" opacity="0.8"/>
    <!-- radial dashed connectors (centre <-> each organ) -->
    <g stroke-dasharray="1 11" opacity="0.85">
      <line x1="512" y1="358" x2="512" y2="248"/>
      <line x1="512" y1="642" x2="512" y2="752"/>
      <line x1="654" y1="500" x2="764" y2="500"/>
      <line x1="370" y1="500" x2="260" y2="500"/>
    </g>
    <!-- small arrow chevrons on the connectors -->
    <g opacity="0.85">
      <path d="M505 262 l7 -10 l7 10"/><path d="M505 738 l7 10 l7 -10"/>
      <path d="M750 493 l10 7 l-10 7"/><path d="M274 493 l-10 7 l10 7"/>
    </g>

    <!-- ===== centre: kidneys ===== -->
    <circle cx="512" cy="500" r="140"/>
    <path d="M474 432 C443 437 433 478 449 516 C457 540 487 540 491 512 C485 495 485 482 491 463 C497 444 494 429 474 432 Z"/>
    <path d="M550 432 C581 437 591 478 575 516 C567 540 537 540 533 512 C539 495 539 482 533 463 C527 444 530 429 550 432 Z"/>
    <path d="M489 508 C497 528 502 548 512 560 C522 548 527 528 535 508"/>
    <line x1="512" y1="560" x2="512" y2="590"/>
    <path d="M468 470 q-14 6 -16 22" opacity="0.7"/>
    <path d="M556 470 q14 6 16 22" opacity="0.7"/>

    <!-- ===== top: heart ===== -->
    <circle cx="512" cy="150" r="96"/>
    <path d="M512 196 C470 158 478 116 506 124 C512 110 528 110 532 126 C552 118 560 152 530 174 C524 184 518 190 512 196 Z"/>
    <path d="M508 124 C504 108 492 100 480 104" opacity="0.75"/>
    <path d="M532 126 C540 110 552 106 562 112" opacity="0.75"/>

    <!-- ===== right: bone ===== -->
    <circle cx="862" cy="500" r="96"/>
    <path d="M846 452 C833 448 831 466 845 470 C838 478 847 488 856 483 L856 517 C847 512 838 522 845 530 C831 534 833 552 846 548 C850 559 870 559 874 548 C887 552 889 534 875 530 C882 522 873 512 864 517 L864 483 C873 488 882 478 875 470 C889 466 887 448 874 452 C870 441 850 441 846 452 Z"/>

    <!-- ===== bottom: intestine ===== -->
    <circle cx="512" cy="850" r="96"/>
    <path d="M466 902 L466 836 C466 814 488 806 512 806 C536 806 558 814 558 836 L558 902"/>
    <path d="M466 902 C466 916 480 920 488 910"/>
    <path d="M486 868 C498 858 510 874 500 884 C492 892 504 900 514 892" opacity="0.85"/>
    <path d="M520 860 C534 856 540 872 528 878 C518 884 528 896 538 890" opacity="0.85"/>

    <!-- ===== left: brain ===== -->
    <circle cx="162" cy="500" r="96"/>
    <path d="M120 506 C112 480 132 456 158 458 C170 446 198 452 200 474 C214 480 214 506 198 514 C200 534 178 546 160 540 C140 550 114 536 120 512"/>
    <line x1="162" y1="458" x2="160" y2="540" opacity="0.6"/>
    <path d="M140 482 q12 6 8 18" opacity="0.6"/>
    <path d="M186 484 q-12 6 -6 18" opacity="0.6"/>
    <path d="M158 540 l0 16 q0 8 -10 8" opacity="0.7"/>
  </g>
</svg>

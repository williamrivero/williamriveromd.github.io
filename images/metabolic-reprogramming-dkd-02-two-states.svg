<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif">
<title id="t">Two overlapping metabolic states in diabetic kidney disease</title>
<desc id="d">Left panel: a higher-workload state with more filtered glucose and sodium, more proximal transport, and higher ATP and oxygen demand, with mouse tracer data showing increased flux. Right panel: a reduced-flexibility state with mitochondrial stress, lower fatty acid oxidation gene expression in human fibrotic tubules, glycolytic activation and fibrosis. A central overlap shows a feedback loop between mitochondrial injury and lower oxidative capacity.</desc>
<rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker></defs><text x="30" y="40" font-size="22" fill="#1F3864" font-weight="700" text-anchor="start">From more transport work to less metabolic flexibility</text><text x="30" y="64" font-size="13" fill="#5b6678" font-weight="400" text-anchor="start">Overlapping states, not a fixed timeline</text><rect x="30" y="90" width="340" height="330" rx="12" fill="#f1f8f8" stroke="#1A6B72" stroke-width="1.6"/><text x="48" y="120" font-size="16" fill="#1A6B72" font-weight="700" text-anchor="start">Higher workload state</text><text x="48" y="150" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• More glucose and sodium filtered</text><text x="48" y="173" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• More proximal reabsorption</text><text x="48" y="196" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">  (SGLT2, Na⁺/K⁺-ATPase)</text><text x="48" y="219" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• Higher ATP and oxygen demand</text><text x="48" y="242" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• Hyperfiltration in some patients</text><text x="48" y="265" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• Mouse tracer data: cortical glucose</text><text x="48" y="288" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">  and fatty acid flux increased early</text><rect x="48" y="330" width="169.20000000000002" height="22" rx="11" fill="#1A6B72" fill-opacity="0.12" stroke="#1A6B72" stroke-width="1"/><text x="132.60000000000002" y="345" font-size="11.5" fill="#1A6B72" font-weight="700" text-anchor="middle">flux measured (mouse)</text><rect x="630" y="90" width="340" height="330" rx="12" fill="#fdf3f1" stroke="#C00000" stroke-width="1.6"/><text x="648" y="120" font-size="16" fill="#C00000" font-weight="700" text-anchor="start">Reduced flexibility state</text><text x="648" y="150" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• Mitochondrial stress, poor repair</text><text x="648" y="173" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• FAO pathway genes lower in</text><text x="648" y="196" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">  fibrotic human tubules</text><text x="648" y="219" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• Glycolytic pathway activation</text><text x="648" y="242" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• Lipid handling shifts; fibrosis</text><text x="648" y="265" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">• Urine organic-anion and TCA</text><text x="648" y="288" font-size="13" fill="#3d4a5c" font-weight="400" text-anchor="start">  signals change</text><rect x="648" y="330" width="183.6" height="22" rx="11" fill="#C00000" fill-opacity="0.12" stroke="#C00000" stroke-width="1"/><text x="739.8" y="345" font-size="11.5" fill="#C00000" font-weight="700" text-anchor="middle">gene expression (human)</text><rect x="648" y="360" width="176.4" height="22" rx="11" fill="#4B3280" fill-opacity="0.12" stroke="#4B3280" stroke-width="1"/><text x="736.2" y="375" font-size="11.5" fill="#4B3280" font-weight="700" text-anchor="middle">static metabolite pool</text><rect x="390" y="130" width="220" height="250" rx="14" fill="#f5f2fb" stroke="#4B3280" stroke-width="1.6" stroke-dasharray="6 5"/><text x="500" y="160" font-size="14" fill="#4B3280" font-weight="700" text-anchor="middle">Overlap</text><text x="500" y="192" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">Mitochondrial injury</text><path d="M455 215 C455 270 545 270 545 215" fill="none" stroke="#C00000" stroke-width="2" marker-end="url(#a1)"/><path d="M545 300 C545 245 455 245 455 300" fill="none" stroke="#C00000" stroke-width="2" marker-end="url(#a1)"/><text x="500" y="330" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">Lower oxidative</text><text x="500" y="348" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">capacity</text><line x1="372" y1="255" x2="388" y2="255" stroke="#1A6B72" stroke-width="2" marker-end="url(#a)"/><line x1="628" y1="255" x2="612" y2="255" stroke="#C00000" stroke-width="2" marker-end="url(#a1)"/><rect x="30" y="440" width="940" height="90" rx="12" fill="#f8fafc" stroke="#c9d2de" stroke-width="1.6"/><text x="50" y="468" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">Why the two observations do not contradict each other: species, disease stage, kidney compartment and the measurement differ</text><text x="50" y="488" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">(tracer flux in early diabetic mice vs. gene expression in established human fibrosis). Some people lose eGFR without heavy</text><text x="50" y="508" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">albuminuria, so no single sequence fits everyone.</text>
<text x="986" y="548" text-anchor="end" font-size="11" fill="#1F3864" fill-opacity="0.55">© renalcarematters.com</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif">
<title id="t">Fuel use along the nephron in diabetic kidney disease</title>
<desc id="d">Nephron schematic across cortex and medulla with three callouts: proximal tubule relies on fatty acid oxidation and oxidative phosphorylation for transport; the thick ascending limb and distal segments differ in glycolytic capacity with low outer-medullary oxygen reserve; podocytes use glycolytic and mitochondrial pathways. Each callout notes what changes in diabetic kidney disease.</desc>
<rect width="1000" height="640" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/></marker></defs><text x="30" y="40" font-size="22" fill="#1F3864" font-weight="700" text-anchor="start">Different fuels in different places</text><text x="30" y="64" font-size="13" fill="#5b6678" font-weight="400" text-anchor="start">Qualitative fuel dependence along the nephron. Oxygen shading is context only; no numerical values.</text><rect x="30" y="90" width="420" height="250" fill="#eef5f6"/><rect x="30" y="340" width="420" height="150" fill="#dce9ee"/><rect x="30" y="490" width="420" height="110" fill="#c9dce4"/><text x="40" y="112" font-size="11" fill="#1A6B72" font-weight="700" text-anchor="start">CORTEX</text><text x="40" y="362" font-size="11" fill="#1A6B72" font-weight="700" text-anchor="start">OUTER MEDULLA</text><text x="40" y="512" font-size="11" fill="#1A6B72" font-weight="700" text-anchor="start">INNER MEDULLA</text><text x="40" y="380" font-size="11" fill="#1F3864" font-weight="600" text-anchor="start" font-style="italic">lower oxygen reserve</text><circle cx="140" cy="175" r="34" fill="#fde9e3" stroke="#C00000" stroke-width="2"/><path d="M118 172 q10 -18 22 0 q12 18 22 0" fill="none" stroke="#C00000" stroke-width="2"/><text x="140" y="228" font-size="12" fill="#1e2a38" font-weight="700" text-anchor="middle">Glomerulus</text><path d="M172 170 C230 150 250 110 300 130 C350 150 330 200 280 210 C240 220 250 260 300 262 C330 263 345 280 345 310 L345 470" fill="none" stroke="#e7c34a" stroke-width="16" stroke-linecap="round"/><text x="305" y="120" font-size="12" fill="#1e2a38" font-weight="700" text-anchor="start">Proximal tubule</text><path d="M345 470 C345 560 385 560 385 470" fill="none" stroke="#9fb3c8" stroke-width="10" stroke-linecap="round"/><path d="M385 470 L385 330" fill="none" stroke="#C55A11" stroke-width="12" stroke-linecap="round"/><text x="395" y="430" font-size="12" fill="#C55A11" font-weight="700" text-anchor="start">TAL</text><path d="M385 330 C385 260 420 240 405 200 C395 175 360 180 360 200" fill="none" stroke="#7aa6c2" stroke-width="10" stroke-linecap="round"/><path d="M430 140 L430 600" fill="none" stroke="#5b86a6" stroke-width="10"/><text x="420" y="160" font-size="11" fill="#1F3864" font-weight="700" text-anchor="end">CD</text><rect x="480" y="92" width="490" height="154" rx="12" fill="#ffffff" stroke="#e7c34a" stroke-width="1.6"/><rect x="480" y="92" width="8" height="154" rx="4" fill="#e7c34a"/><text x="502" y="118" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">Proximal tubule</text><text x="502" y="142" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• High ATP demand for sodium-coupled transport</text><text x="502" y="162" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• Fatty acid oxidation + OXPHOS carry much of the load</text><text x="502" y="182" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• Cortex also makes glucose (gluconeogenesis)</text><text x="502" y="202" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• SGLT2/SGLT1 move glucose; they do not burn it</text><text x="502" y="230" font-size="12.5" fill="#8a6a00" font-weight="700" text-anchor="start">In DKD: more work early; injured tubules lose oxidative capacity</text><rect x="480" y="262" width="490" height="134" rx="12" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><rect x="480" y="262" width="8" height="134" rx="4" fill="#C55A11"/><text x="502" y="288" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">Thick ascending limb and distal segments</text><text x="502" y="312" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• TAL still spends considerable ATP on transport</text><text x="502" y="332" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• Segments differ in glycolytic capacity</text><text x="502" y="352" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• Outer medulla has a small oxygen margin</text><text x="502" y="380" font-size="12.5" fill="#C55A11" font-weight="700" text-anchor="start">In DKD: redistributed transport can shift local O₂ demand</text><rect x="480" y="420" width="490" height="114" rx="12" fill="#ffffff" stroke="#C00000" stroke-width="1.6"/><rect x="480" y="420" width="8" height="114" rx="4" fill="#C00000"/><text x="502" y="446" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">Glomerulus and podocytes</text><text x="502" y="470" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• Podocytes keep the filtration barrier intact</text><text x="502" y="490" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">• Use glycolytic and mitochondrial pathways by context</text><text x="502" y="518" font-size="12.5" fill="#C00000" font-weight="700" text-anchor="start">In DKD: lipid remodeling, oxidant stress, albumin leak</text><text x="480" y="618" font-size="12" fill="#5b6678" font-weight="400" text-anchor="start" font-style="italic">Cell state, disease stage and experimental model all change these labels.</text>
<text x="986" y="628" text-anchor="end" font-size="11" fill="#1F3864" fill-opacity="0.55">© renalcarematters.com</text>
</svg>

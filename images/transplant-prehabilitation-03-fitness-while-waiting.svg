<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">Illustrative fitness trajectories while waiting for a kidney transplant</title>
<desc id="d">Conceptual drawing, not data. Usual care drifts down. A prehabilitation block raises fitness; if exercise stops, fitness falls back toward usual care; if it continues as a routine, fitness is maintained.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="60" y="66" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="34" font-weight="700" fill="#1F3864">Fitness while waiting: the program helps, the habit keeps it</text>
<text x="60" y="104" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="21" fill="#4B5563">Illustration only, not study data. Shapes follow the pattern reported in FRAILMar.</text>
<rect x="120.0" y="170" width="166.7" height="370" fill="#E6F2F3"/>
<text x="203.3" y="198" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="18" font-weight="600" fill="#1A6B72">8-week program</text>
<line x1="120" y1="540" x2="1120" y2="540" stroke="#4B5563" stroke-width="2"/>
<line x1="120" y1="170" x2="120" y2="540" stroke="#4B5563" stroke-width="2"/>
<text x="620.0" y="588" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="20" fill="#4B5563">Time on the waiting list (months)</text>
<text x="70" y="355.0" transform="rotate(-90 70 355.0)" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="20" fill="#4B5563">Fitness and strength</text>
<text x="120.0" y="564" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">0</text>
<text x="370.0" y="564" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">3</text>
<text x="620.0" y="564" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">6</text>
<text x="870.0" y="564" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">9</text>
<text x="1120.0" y="564" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">12</text>

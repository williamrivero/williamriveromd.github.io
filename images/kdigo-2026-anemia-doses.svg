<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">ESA starting doses: examples, not conversions</title><desc id="desc">KDIGO 2026 clinical reference reviewed November 6, 2026.</desc><rect width="1000" height="850" rx="24" fill="#f4f7fa"/><rect width="1000" height="138" rx="24" fill="#13315a"/><text x="44" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4c842">RENAL CARE MATTERS · KDIGO 2026</text><text x="44" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">ESA starting doses: examples, not conversions</text><rect x="30" y="158" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="158" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Epoetin alfa / beta</text><text x="54" y="220" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Non-dialysis CKD: about 50 U/kg once or twice weekly. HD / PD: 50–100 U/kg three</text><text x="54" y="244" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">times weekly. Regional labels may differ.</text><rect x="30" y="302" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="302" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Darbepoetin</text><text x="54" y="364" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Non-dialysis: 0.45 µg/kg weekly or 40–100 µg every 2–4 weeks. HD / PD: 0.45 µg/kg</text><text x="54" y="388" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">weekly or 0.75 µg/kg every 2 weeks.</text><rect x="30" y="446" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="446" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">CERA</text><text x="54" y="508" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Initial example: 0.6 µg/kg every 2 weeks. Monthly maintenance and product switches</text><text x="54" y="532" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">require label-specific review.</text><rect x="30" y="590" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="590" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Apply only after clinical selection</text><text x="54" y="652" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Confirm indication, product, route, practical dose, and interval. Use the lowest</text><text x="54" y="676" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">effective dose; adult Hb maintenance goal below 11.5 g/dL.</text><text x="44" y="814" font-family="Arial,sans-serif" font-size="15" fill="#465568">Clinical decisions require individual assessment. Source: KDIGO 2026 Anemia in CKD.</text><text x="44" y="837" font-family="Arial,sans-serif" font-size="14" fill="#465568">renalcarematters.com · Reviewed November 6, 2026 · Hb: hemoglobin; HD: hemodialysis; PD: peritoneal dialysis</text></svg>
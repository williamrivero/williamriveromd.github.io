<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif">
<title id="t">Patient picture of kidney cells under diabetes stress</title>
<desc id="d">Three panels. Healthy kidney cells burn fat cleanly with working power plants and an anti-rust crew. Under diabetes overload, too much sugar and salt arrive, cells work overtime and fat piles up. In the third panel, iron and damaged fats start a rusting chain reaction, the anti-rust crew runs out, and cells die and scar. A note says rusting is shown in laboratory studies but cannot yet be measured in patients.</desc>
<rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker></defs><text x="30" y="40" font-size="22" fill="#1F3864" font-weight="700" text-anchor="start">Your kidney cells: from busy factory to rusting walls</text><rect x="30" y="66" width="300" height="340" rx="12" fill="#f1f8f8" stroke="#1A6B72" stroke-width="1.6"/><text x="50" y="96" font-size="16" fill="#1A6B72" font-weight="700" text-anchor="start">1  Healthy</text><rect x="85" y="136" width="190" height="120" rx="26" fill="#ffffff" stroke="#1A6B72" stroke-width="3"/><ellipse cx="120" cy="206" rx="16" ry="9" fill="#f5d27a" stroke="#a87f1c"/><ellipse cx="160" cy="206" rx="16" ry="9" fill="#f5d27a" stroke="#a87f1c"/><ellipse cx="200" cy="206" rx="16" ry="9" fill="#f5d27a" stroke="#a87f1c"/><text x="50" y="300" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Fat is the main fuel</text><text x="50" y="324" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Power plants (mitochondria)</text><text x="50" y="348" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">run cleanly</text><text x="50" y="372" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Anti-rust crew on duty</text><rect x="350" y="66" width="300" height="340" rx="12" fill="#fdf5ee" stroke="#C55A11" stroke-width="1.6"/><text x="370" y="96" font-size="16" fill="#C55A11" font-weight="700" text-anchor="start">2  Diabetes overload</text><rect x="405" y="136" width="190" height="120" rx="26" fill="#ffffff" stroke="#C55A11" stroke-width="3"/><ellipse cx="440" cy="206" rx="16" ry="9" fill="#f5d27a" stroke="#a87f1c"/><ellipse cx="480" cy="206" rx="16" ry="9" fill="#f5d27a" stroke="#a87f1c"/><ellipse cx="520" cy="206" rx="16" ry="9" fill="#f5d27a" stroke="#a87f1c"/><ellipse cx="560" cy="206" rx="16" ry="9" fill="#f5d27a" stroke="#a87f1c"/><circle cx="430" cy="166" r="9" fill="#f3e3b5" stroke="#c7a54a"/><circle cx="474" cy="166" r="9" fill="#f3e3b5" stroke="#c7a54a"/><circle cx="518" cy="166" r="9" fill="#f3e3b5" stroke="#c7a54a"/><circle cx="562" cy="166" r="9" fill="#f3e3b5" stroke="#c7a54a"/><line x1="350" y1="196" x2="400" y2="196" stroke="#C55A11" stroke-width="3" marker-end="url(#a)"/><line x1="350" y1="226" x2="400" y2="221" stroke="#C55A11" stroke-width="3" marker-end="url(#a)"/><text x="370" y="300" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Too much sugar and salt</text><text x="370" y="324" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">arrive every day</text><text x="370" y="348" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Cells work overtime</text><text x="370" y="372" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Fat piles up unused</text><rect x="670" y="66" width="300" height="340" rx="12" fill="#fdf3f1" stroke="#C00000" stroke-width="1.6"/><text x="690" y="96" font-size="16" fill="#C00000" font-weight="700" text-anchor="start">3  Rusting walls</text><rect x="725" y="136" width="190" height="120" rx="26" fill="#ffffff" stroke="#C00000" stroke-width="3"/><ellipse cx="760" cy="206" rx="16" ry="9" fill="#e9b4a6" stroke="#a87f1c"/><ellipse cx="800" cy="206" rx="16" ry="9" fill="#e9b4a6" stroke="#a87f1c"/><circle cx="750" cy="166" r="9" fill="#f3e3b5" stroke="#c7a54a"/><circle cx="794" cy="166" r="9" fill="#f3e3b5" stroke="#c7a54a"/><circle cx="838" cy="166" r="9" fill="#f3e3b5" stroke="#c7a54a"/><circle cx="882" cy="166" r="9" fill="#f3e3b5" stroke="#c7a54a"/><circle cx="730" cy="254" r="7" fill="#b5532a" fill-opacity="0.75"/><circle cx="766" cy="254" r="7" fill="#b5532a" fill-opacity="0.75"/><circle cx="802" cy="254" r="7" fill="#b5532a" fill-opacity="0.75"/><circle cx="838" cy="254" r="7" fill="#b5532a" fill-opacity="0.75"/><circle cx="874" cy="254" r="7" fill="#b5532a" fill-opacity="0.75"/><circle cx="910" cy="254" r="7" fill="#b5532a" fill-opacity="0.75"/><text x="690" y="300" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Iron + damaged fats</text><text x="690" y="324" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">start a chain reaction</text><text x="690" y="348" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Anti-rust crew runs out</text><text x="690" y="372" font-size="14" fill="#3d4a5c" font-weight="400" text-anchor="start">Cells die, scars form</text><text x="30" y="440" font-size="12.5" fill="#5b6678" font-weight="400" text-anchor="start" font-style="italic">Rusting (ferroptosis) is well shown in laboratory studies. Doctors cannot yet measure it in patients, and no rust-blocking medicine is approved.</text>
<text x="986" y="458" text-anchor="end" font-size="11" fill="#1F3864" fill-opacity="0.55">© renalcarematters.com</text>
</svg>

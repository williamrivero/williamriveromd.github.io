<text x="284" y="348" font-size="12.5" fill="#5b6575" text-anchor="end">eGFR 30–44</text>
<rect x="302" y="306" width="196" height="54" rx="6" fill="#F0A04B"/>
<rect x="502" y="306" width="196" height="54" rx="6" fill="#D9534F"/>
<rect x="702" y="306" width="196" height="54" rx="6" fill="#D9534F"/>
<text x="284" y="387" font-size="15" font-weight="700" fill="#1e2a38" text-anchor="end">G4</text>
<text x="284" y="406" font-size="12.5" fill="#5b6575" text-anchor="end">eGFR 15–29</text>

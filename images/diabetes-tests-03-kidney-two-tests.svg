<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t3 d3" style="font-family:Inter,'Nunito Sans',Manrope,Arial,sans-serif">
<title id="t3">Two kidney tests read together: eGFR and urine albumin-to-creatinine ratio</title><desc id="d3">A grid with eGFR categories G1 to G5 down the side and urine albumin-to-creatinine ratio categories A1 to A3 across the top. Colors run from green, low risk, through yellow and orange to red, very high risk. Risk depends on both numbers together. A person can have normal eGFR and raised albumin, or reduced eGFR and normal albumin.</desc>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#1F3864">Your two kidney numbers are read together</text>
<text x="40" y="70" font-size="14" fill="#5b6575">Down: eGFR, how well the kidneys filter (mL/min/1.73 m²). Across: urine ACR, albumin leaking into urine (mg/g).</text>
<text x="600.0" y="102" font-size="14" font-weight="700" fill="#1e2a38" text-anchor="middle">Urine albumin-to-creatinine ratio (UACR, mg/g)</text>
<text x="400.0" y="122" font-size="13.5" fill="#1e2a38" text-anchor="middle">A1  under 30</text>
<text x="600.0" y="122" font-size="13.5" fill="#1e2a38" text-anchor="middle">A2  30–299</text>
<text x="800.0" y="122" font-size="13.5" fill="#1e2a38" text-anchor="middle">A3  300 or more</text>
<text x="284" y="155" font-size="15" font-weight="700" fill="#1e2a38" text-anchor="end">G1</text>
<text x="284" y="174" font-size="12.5" fill="#5b6575" text-anchor="end">eGFR 90 or above</text>
<rect x="302" y="132" width="196" height="54" rx="6" fill="#5FAE6E"/>
<rect x="502" y="132" width="196" height="54" rx="6" fill="#F2D46B"/>
<rect x="702" y="132" width="196" height="54" rx="6" fill="#F0A04B"/>
<text x="284" y="213" font-size="15" font-weight="700" fill="#1e2a38" text-anchor="end">G2</text>
<text x="284" y="232" font-size="12.5" fill="#5b6575" text-anchor="end">eGFR 60–89</text>
<rect x="302" y="190" width="196" height="54" rx="6" fill="#5FAE6E"/>
<rect x="502" y="190" width="196" height="54" rx="6" fill="#F2D46B"/>
<rect x="702" y="190" width="196" height="54" rx="6" fill="#F0A04B"/>
<text x="284" y="271" font-size="15" font-weight="700" fill="#1e2a38" text-anchor="end">G3a</text>
<text x="284" y="290" font-size="12.5" fill="#5b6575" text-anchor="end">eGFR 45–59</text>
<rect x="302" y="248" width="196" height="54" rx="6" fill="#F2D46B"/>
<rect x="502" y="248" width="196" height="54" rx="6" fill="#F0A04B"/>
<rect x="702" y="248" width="196" height="54" rx="6" fill="#D9534F"/>

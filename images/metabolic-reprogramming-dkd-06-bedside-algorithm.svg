<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="t d" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif">
<title id="t">Bedside algorithm for kidney protection in diabetes with CKD</title>
<desc id="d">Seven steps: confirm CKD with eGFR and repeated UACR; look for another cause when red flags appear; foundation therapy including ACE inhibitor or ARB; SGLT2 inhibitor from eGFR 20; finerenone for type 2 diabetes with albuminuria, eGFR at least 25 and acceptable potassium; a GLP-1 receptor agonist with proven benefit; and monitoring potassium and creatinine at 2 to 4 weeks with a goal of at least 30 percent UACR reduction. Side panels cover type 1 diabetes and urgent escalation for ketoacidosis symptoms.</desc>
<rect width="1000" height="760" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/></marker></defs><text x="30" y="40" font-size="22" fill="#1F3864" font-weight="700" text-anchor="start">Bedside decisions in diabetes with CKD</text><text x="30" y="64" font-size="13" fill="#5b6678" font-weight="400" text-anchor="start">Guidance, product labels and local availability differ. Verify each drug&#x27;s label before prescribing.</text><rect x="30" y="86" width="690" height="78" rx="12" fill="#ffffff" stroke="#1A6B72" stroke-width="1.6"/><rect x="30" y="86" width="10" height="78" rx="5" fill="#1A6B72"/><text x="56" y="114" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">1  Find and confirm CKD</text><text x="56" y="136" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">eGFR + spot UACR yearly (T2D from diagnosis; T1D after ≥5 years). Albuminuria persistent</text><text x="56" y="153" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">if 2 of 3 samples abnormal over 3–6 months.</text><line x1="375" y1="164" x2="375" y2="178" stroke="#5b6678" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="180" width="690" height="78" rx="12" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><rect x="30" y="180" width="10" height="78" rx="5" fill="#C55A11"/><text x="56" y="208" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">2  Look beyond DKD when indicated</text><text x="56" y="230" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Active sediment, abrupt eGFR fall, rapidly rising proteinuria, nephrotic syndrome, or</text><text x="56" y="247" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">(T1D) no retinopathy.</text><line x1="375" y1="258" x2="375" y2="272" stroke="#5b6678" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="274" width="690" height="78" rx="12" fill="#ffffff" stroke="#1F3864" stroke-width="1.6"/><rect x="30" y="274" width="10" height="78" rx="5" fill="#1F3864"/><text x="56" y="302" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">3  Foundation</text><text x="56" y="324" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Individualized BP and glucose targets, nutrition, activity, no smoking, lipid care. ACE</text><text x="56" y="341" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">inhibitor or ARB at maximum tolerated dose if hypertension + albuminuria.</text><line x1="375" y1="352" x2="375" y2="366" stroke="#5b6678" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="368" width="690" height="78" rx="12" fill="#ffffff" stroke="#2E6B3E" stroke-width="1.6"/><rect x="30" y="368" width="10" height="78" rx="5" fill="#2E6B3E"/><text x="56" y="396" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">4  SGLT2 inhibitor</text><text x="56" y="418" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">T2D with CKD from eGFR ≥20; continue below 20 if tolerated until kidney replacement</text><text x="56" y="435" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">therapy. Sick-day and peri-procedure holds.</text><line x1="375" y1="446" x2="375" y2="460" stroke="#5b6678" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="462" width="690" height="78" rx="12" fill="#ffffff" stroke="#4B3280" stroke-width="1.6"/><rect x="30" y="462" width="10" height="78" rx="5" fill="#4B3280"/><text x="56" y="490" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">5  Finerenone (T2D)</text><text x="56" y="512" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Albuminuria ≥30 mg/g despite RAS blockade, eGFR ≥25, potassium within label limits.</text><text x="56" y="529" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Simultaneous start with SGLT2i can be considered.</text><line x1="375" y1="540" x2="375" y2="554" stroke="#5b6678" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="556" width="690" height="78" rx="12" fill="#ffffff" stroke="#1A6B72" stroke-width="1.6"/><rect x="30" y="556" width="10" height="78" rx="5" fill="#1A6B72"/><text x="56" y="584" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">6  GLP-1 receptor agonist</text><text x="56" y="606" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Agent with proven kidney/CV benefit; semaglutide 1 mg weekly has dedicated kidney outcome</text><text x="56" y="623" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">data (FLOW).</text><line x1="375" y1="634" x2="375" y2="648" stroke="#5b6678" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="650" width="690" height="78" rx="12" fill="#ffffff" stroke="#C00000" stroke-width="1.6"/><rect x="30" y="650" width="10" height="78" rx="5" fill="#C00000"/><text x="56" y="678" font-size="15" fill="#1e2a38" font-weight="700" text-anchor="start">7  Monitor and respond</text><text x="56" y="700" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Potassium + creatinine at 2–4 weeks after start or dose change. Creatinine rise ≤30%</text><text x="56" y="717" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">without volume depletion: usually continue. ADA goal: ≥30% UACR fall when baseline UACR</text><text x="56" y="734" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">≥300 mg/g.</text><rect x="745" y="86" width="225" height="320" rx="12" fill="#f5f2fb" stroke="#4B3280" stroke-width="1.6" stroke-dasharray="6 5"/><text x="760" y="114" font-size="15" fill="#4B3280" font-weight="700" text-anchor="start">Type 1 diabetes</text><text x="760" y="140" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Finerenone lowered UACR</text><text x="760" y="159" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">in FINE-ONE (6 months).</text><text x="760" y="178" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">US label (Sept 2026)</text><text x="760" y="197" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">covers UACR reduction;</text><text x="760" y="216" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">kidney failure events were</text><text x="760" y="235" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">not measured directly.</text><text x="760" y="254" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start"></text><text x="760" y="273" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Check Philippine product</text><text x="760" y="292" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">indication before use.</text><text x="760" y="311" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start"></text><text x="760" y="330" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">SGLT2i/GLP-1 RA evidence</text><text x="760" y="349" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">in T1D is more limited.</text><rect x="745" y="426" width="225" height="230" rx="12" fill="#fdf3f1" stroke="#C00000" stroke-width="1.6"/><text x="760" y="454" font-size="15" fill="#C00000" font-weight="700" text-anchor="start">Stop and escalate</text><text x="760" y="480" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">On an SGLT2 inhibitor:</text><text x="760" y="499" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">nausea, vomiting, belly</text><text x="760" y="518" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">pain or fast breathing,</text><text x="760" y="537" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">even with near-normal</text><text x="760" y="556" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">glucose → urgent check</text><text x="760" y="575" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">for ketoacidosis.</text><text x="760" y="594" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start"></text><text x="760" y="613" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">Potassium above label</text><text x="760" y="632" font-size="12.3" fill="#3d4a5c" font-weight="400" text-anchor="start">threshold → hold per label.</text>
<text x="986" y="748" text-anchor="end" font-size="11" fill="#1F3864" fill-opacity="0.55">© renalcarematters.com</text>
</svg>

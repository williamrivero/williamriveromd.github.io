<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
<title id="t">Kidney transplant recipients meeting dietary targets</title>
<desc id="d">Of 167 recipients about 5 months after transplant: fruit 22%, vegetables 28%, fiber 26%, plant-to-total protein ratio at least 0.50 12%.</desc>
<rect width="1200" height="675" fill="#ffffff"/>
<text x="60" y="70" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="34" font-weight="700" fill="#1F3864">Few recipients meet healthy-eating targets after transplant</text>
<text x="60" y="110" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="21" fill="#4B5563">Share of 167 kidney transplant recipients, median 147 days after transplant, meeting each Dutch target</text>
<text x="360" y="214" text-anchor="end" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="23" fill="#1F3864">Fruit ≥200 g/day</text>
<rect x="380" y="180" width="700" height="52" rx="10" fill="#E5E7EB"/>
<rect x="380" y="180" width="154.0" height="52" rx="10" fill="#1A6B72"/>
<text x="548.0" y="216" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3864">22%</text>
<text x="360" y="306" text-anchor="end" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="23" fill="#1F3864">Vegetables ≥200 g/day</text>
<rect x="380" y="272" width="700" height="52" rx="10" fill="#E5E7EB"/>
<rect x="380" y="272" width="196.0" height="52" rx="10" fill="#1A6B72"/>
<text x="590.0" y="308" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3864">28%</text>
<text x="360" y="398" text-anchor="end" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="23" fill="#1F3864">Fiber ≥25 g/day</text>
<rect x="380" y="364" width="700" height="52" rx="10" fill="#E5E7EB"/>
<rect x="380" y="364" width="182.0" height="52" rx="10" fill="#1A6B72"/>
<text x="576.0" y="400" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3864">26%</text>
<text x="360" y="490" text-anchor="end" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="23" fill="#1F3864">Plant protein ≥50% of total</text>
<rect x="380" y="456" width="700" height="52" rx="10" fill="#E5E7EB"/>
<rect x="380" y="456" width="84.0" height="52" rx="10" fill="#B45309"/>
<text x="478.0" y="492" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="26" font-weight="700" fill="#1F3864">12%</text>
<text x="380.0" y="572" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">0%</text>
<text x="555.0" y="572" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">25%</text>
<text x="730.0" y="572" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">50%</text>
<text x="905.0" y="572" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">75%</text>
<text x="1080.0" y="572" text-anchor="middle" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#4B5563">100%</text>
<text x="60" y="613" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="18" fill="#4B5563">Source: Doorenbos et al., Journal of Renal Nutrition 2026; Active Care after Transplantation study, the Netherlands.</text>
<text x="1160" y="651" text-anchor="end" font-family="Inter, 'Nunito Sans', Arial, sans-serif" font-size="17" fill="#1F3864" opacity="0.7">© renalcarematters.com</text>
</svg>
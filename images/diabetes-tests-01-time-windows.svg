<text x="40" y="311" font-size="15" font-weight="700" fill="#1e2a38">Fructosamine / glycated albumin</text>
<text x="40" y="330" font-size="12.5" fill="#5b6575">roughly the last 2–3 weeks</text>
<rect x="803" y="303" width="147" height="22" rx="11" fill="#C55A11" opacity=".85"/>
<text x="40" y="373" font-size="15" font-weight="700" fill="#1e2a38">A1C (HbA1c)</text>
<text x="40" y="392" font-size="12.5" fill="#5b6575">roughly the last 2–3 months</text>

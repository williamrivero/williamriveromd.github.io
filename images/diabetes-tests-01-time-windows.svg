<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t1 d1" style="font-family:Inter,'Nunito Sans',Manrope,Arial,sans-serif">
<title id="t1">What stretch of time each diabetes test reflects</title><desc id="d1">Timeline from about 100 days ago to today. Fasting glucose and fingerstick readings are single moments. A glucose sensor records continuously over its 10 to 14 day wear. Fructosamine and glycated albumin reflect roughly the last 2 to 3 weeks. A1C reflects roughly the last 2 to 3 months, weighted toward recent weeks.</desc>
<rect width="1000" height="500" fill="#ffffff"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#1F3864">Each test looks at a different stretch of time</text>
<text x="40" y="70" font-size="14" fill="#5b6575">Approximate windows. Kidney disease, anemia treatment and blood loss can shorten or distort them.</text>
<line x1="320" y1="96" x2="320" y2="430" stroke="#e3e8ef" stroke-width="1"/>
<text x="320" y="452" font-size="13" fill="#5b6575" text-anchor="middle">~3 months ago</text>
<line x1="530" y1="96" x2="530" y2="430" stroke="#e3e8ef" stroke-width="1"/>
<text x="530" y="452" font-size="13" fill="#5b6575" text-anchor="middle">~2 months</text>
<line x1="740" y1="96" x2="740" y2="430" stroke="#e3e8ef" stroke-width="1"/>
<text x="740" y="452" font-size="13" fill="#5b6575" text-anchor="middle">~1 month</text>
<line x1="852" y1="96" x2="852" y2="430" stroke="#e3e8ef" stroke-width="1"/>
<text x="852" y="452" font-size="13" fill="#5b6575" text-anchor="middle">2 wk</text>
<line x1="950" y1="96" x2="950" y2="430" stroke="#e3e8ef" stroke-width="1"/>
<text x="950" y="452" font-size="13" fill="#5b6575" text-anchor="middle">Today</text>
<text x="40" y="125" font-size="15" font-weight="700" fill="#1e2a38">Fasting glucose</text>
<text x="40" y="144" font-size="12.5" fill="#5b6575">one moment, after 8 h fasting</text>
<circle cx="944" cy="128" r="9" fill="#1A6B72"/>
<text x="40" y="187" font-size="15" font-weight="700" fill="#1e2a38">Fingerstick meter</text>
<text x="40" y="206" font-size="12.5" fill="#5b6575">one moment, any time</text>
<circle cx="946" cy="190" r="6" fill="#2E6B3E" opacity="1"/>
<circle cx="925" cy="190" r="6" fill="#2E6B3E" opacity="0.35"/>
<circle cx="883" cy="190" r="6" fill="#2E6B3E" opacity="0.35"/>
<circle cx="806" cy="190" r="6" fill="#2E6B3E" opacity="0.35"/>
<text x="40" y="249" font-size="15" font-weight="700" fill="#1e2a38">Glucose sensor (CGM)</text>
<text x="40" y="268" font-size="12.5" fill="#5b6575">every few minutes, 10–14 days</text>

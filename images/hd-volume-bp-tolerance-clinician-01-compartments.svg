<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d" font-family="Inter, 'Nunito Sans', Manrope, Arial, sans-serif">
<title id="t">Where ultrafiltration takes fluid from, and what keeps blood pressure up while it does</title>
<desc id="d">Schematic. The dialyzer removes water and sodium only from plasma. Plasma is refilled from the interstitial space across the capillary wall. Blood pressure during the session depends on how fast refill keeps up, on venous capacitance, on cardiac reserve, and on autonomic and vascular compensation. Congestion lives mainly in the interstitium, so a patient can be congested and still become hypotensive.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3864"/></marker>
<marker id="arT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a6b72"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
</defs>
<rect width="1200" height="760" fill="#ffffff"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#0f1e2e">Two problems, two compartments: congestion versus tolerance</text>
<text x="40" y="82" font-size="16" fill="#3b4a5c">The machine removes fluid from plasma; congestion mostly sits in the interstitium. Refill links the two.</text>

<!-- Interstitial compartment -->
<rect x="40" y="120" width="360" height="380" rx="18" fill="#eef6f7" stroke="#1a6b72" stroke-width="2"/>
<text x="64" y="156" font-size="20" font-weight="700" fill="#0e4a50">Interstitial fluid</text>
<text x="64" y="182" font-size="15" fill="#2a3548">Largest share of extracellular water</text>
<text x="64" y="222" font-size="15" fill="#2a3548">• Edema, lung water (B-lines)</text>
<text x="64" y="248" font-size="15" fill="#2a3548">• BIS overhydration estimate</text>
<text x="64" y="274" font-size="15" fill="#2a3548">• Where "congestion" is seen</text>
<rect x="64" y="300" width="312" height="176" rx="12" fill="#ffffff" stroke="#9fc9cc"/>
<text x="80" y="328" font-size="15" font-weight="700" fill="#0e4a50">Refill depends on</text>
<text x="80" y="354" font-size="14" fill="#2a3548">• interstitial pressure and compliance</text>
<text x="80" y="378" font-size="14" fill="#2a3548">• plasma oncotic pressure (albumin)</text>
<text x="80" y="402" font-size="14" fill="#2a3548">• capillary permeability (inflammation)</text>
<text x="80" y="426" font-size="14" fill="#2a3548">• how much excess fluid remains</text>
<text x="80" y="450" font-size="14" fill="#2a3548">• time: refill is not instantaneous</text>

<!-- capillary wall -->
<rect x="420" y="120" width="26" height="380" rx="8" fill="#d7e3ea"/>
<text x="433" y="530" font-size="13" fill="#3b4a5c" text-anchor="middle">capillary wall</text>
<line x1="380" y1="210" x2="510" y2="210" stroke="#1a6b72" stroke-width="4" marker-end="url(#arT)"/>
<text x="445" y="110" font-size="14" font-weight="700" fill="#0e4a50" text-anchor="middle">plasma refill ↓</text>

<!-- Plasma compartment -->
<rect x="520" y="120" width="300" height="380" rx="18" fill="#f3f4f6" stroke="#1f3864" stroke-width="2"/>
<text x="544" y="156" font-size="20" font-weight="700" fill="#0f1e2e">Plasma</text>
<text x="544" y="182" font-size="15" fill="#2a3548">Small, and the only volume</text>
<text x="544" y="204" font-size="15" fill="#2a3548">the dialyzer can reach</text>
<text x="544" y="246" font-size="15" fill="#2a3548">• RBV slope = relative change</text>
<text x="544" y="270" font-size="15" fill="#2a3548">  (not absolute volume)</text>
<text x="544" y="300" font-size="15" fill="#2a3548">• Falls when UF rate</text>
<text x="544" y="322" font-size="15" fill="#2a3548">  outpaces refill</text>
<rect x="544" y="350" width="252" height="126" rx="12" fill="#ffffff" stroke="#c7cfdb"/>
<text x="560" y="378" font-size="15" font-weight="700" fill="#0f1e2e">Venous capacitance</text>
<text x="560" y="404" font-size="14" fill="#2a3548">Splanchnic and skin veins</text>
<text x="560" y="428" font-size="14" fill="#2a3548">pool blood when warm or</text>
<text x="560" y="452" font-size="14" fill="#2a3548">vasodilated, cutting preload</text>

<!-- Dialyzer -->
<rect x="880" y="140" width="110" height="170" rx="22" fill="#ffffff" stroke="#1f3864" stroke-width="2"/>
<line x1="900" y1="160" x2="900" y2="290" stroke="#c7cfdb"/><line x1="915" y1="160" x2="915" y2="290" stroke="#c7cfdb"/><line x1="930" y1="160" x2="930" y2="290" stroke="#c7cfdb"/><line x1="945" y1="160" x2="945" y2="290" stroke="#c7cfdb"/><line x1="960" y1="160" x2="960" y2="290" stroke="#c7cfdb"/><line x1="975" y1="160" x2="975" y2="290" stroke="#c7cfdb"/>
<text x="935" y="336" font-size="16" font-weight="700" fill="#0f1e2e" text-anchor="middle">Dialyzer</text>
<line x1="820" y1="225" x2="872" y2="225" stroke="#1f3864" stroke-width="4" marker-end="url(#ar)"/>
<text x="846" y="211" font-size="13" font-weight="700" fill="#0f1e2e" text-anchor="middle">UF</text>
<line x1="990" y1="225" x2="1150" y2="225" stroke="#1f3864" stroke-width="4" marker-end="url(#ar)"/>
<text x="1070" y="211" font-size="14" font-weight="700" fill="#0f1e2e" text-anchor="middle">machine UF</text>
<text x="1070" y="252" font-size="13" fill="#3b4a5c" text-anchor="middle">volume ÷ time</text>
<text x="1070" y="272" font-size="13" fill="#3b4a5c" text-anchor="middle">= UF rate</text>

<!-- Compensation box -->
<rect x="880" y="370" width="280" height="230" rx="18" fill="#fff7ed" stroke="#b8860b" stroke-width="2"/>
<text x="900" y="404" font-size="18" font-weight="700" fill="#5c3d00">What holds BP up</text>
<text x="900" y="432" font-size="14" fill="#2a3548">• cardiac reserve: a stiff, thick</text>
<text x="900" y="452" font-size="14" fill="#2a3548">  ventricle loses stroke volume fast</text>
<text x="900" y="478" font-size="14" fill="#2a3548">• arteriolar constriction and</text>
<text x="900" y="498" font-size="14" fill="#2a3548">  heart-rate response (autonomic)</text>
<text x="900" y="524" font-size="14" fill="#2a3548">• venoconstriction (capacitance)</text>
<text x="900" y="550" font-size="14" fill="#2a3548">• rhythm, ischemia, infection,</text>
<text x="900" y="570" font-size="14" fill="#2a3548">  bleeding, drugs can each fail it</text>
<line x1="820" y1="430" x2="872" y2="470" stroke="#b8860b" stroke-width="3" marker-end="url(#ar)"/>

<!-- Bottom consequence row -->
<rect x="40" y="560" width="780" height="140" rx="18" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
<text x="64" y="594" font-size="18" font-weight="700" fill="#7f1d1d">Why "congested AND hypotensive" is a real state</text>
<text x="64" y="622" font-size="15" fill="#2a3548">If UF rate exceeds refill, plasma volume falls even while interstitial fluid is still in excess.</text>
<text x="64" y="646" font-size="15" fill="#2a3548">BP then depends on cardiac reserve and vascular compensation; when those fail, BP falls and</text>
<text x="64" y="670" font-size="15" fill="#2a3548">organ perfusion can drop (heart, brain, gut). Low BP does not prove total-body depletion.</text>
<line x1="670" y1="500" x2="670" y2="556" stroke="#b91c1c" stroke-width="3" marker-end="url(#arR)"/>

<text x="40" y="738" font-size="13" fill="#3b4a5c">Conceptual model for teaching, not a validated causal model of any individual patient. BIS, bioimpedance spectroscopy; BP, blood pressure; RBV, relative blood volume; UF, ultrafiltration.</text>
<text x="1160" y="718" font-size="12" fill="#0f1e2e" fill-opacity="0.7" text-anchor="end">© renalcarematters.com</text>
</svg>

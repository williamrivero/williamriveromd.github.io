<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t2 d2" style="font-family:Inter,'Nunito Sans',Manrope,Arial,sans-serif">
<title id="t2">How to read the time-in-ranges bar on a glucose sensor report</title><desc id="d2">A stacked bar divides the day into five glucose bands. Reference goals for many nonpregnant adults: in range 70 to 180 mg/dL more than 70 percent of the time, below 70 under 4 percent, below 54 under 1 percent, above 180 under 25 percent and above 250 under 5 percent. Before reading the bar, check that the sensor was worn about 14 days and was active at least 70 percent of the time. Older or higher-risk adults often have looser goals.</desc>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#1F3864">Reading the time-in-ranges bar on a sensor report</text>
<rect x="40" y="66" width="920" height="54" rx="10" fill="#eef6f6" stroke="#b9d8da"/>
<text x="60" y="90" font-size="14.5" font-weight="700" fill="#1A6B72">Step 1 · Is there enough data?</text>
<text x="60" y="110" font-size="13.5" fill="#1e2a38">About 14 days of wear, with the sensor active at least 70% of the time. Less data = read with caution.</text>
<rect x="60" y="150.0" width="90" height="14.4" fill="#C55A11"/>
<rect x="60" y="164.4" width="90" height="64.8" fill="#E7A15B"/>
<rect x="60" y="229.2" width="90" height="262.8" fill="#2E6B3E"/>
<rect x="60" y="492.0" width="90" height="14.4" fill="#D9534F"/>
<rect x="60" y="506.4" width="90" height="3.6" fill="#8B0000"/>
<text x="105.0" y="536" font-size="12" fill="#5b6575" text-anchor="middle">example report</text>
<rect x="190" y="158" width="14" height="14" rx="3" fill="#C55A11"/>
<text x="214" y="170" font-size="15" font-weight="700" fill="#1e2a38">Very high</text>
<text x="214" y="189" font-size="12.5" fill="#5b6575">above 250 mg/dL (13.9 mmol/L)</text>
<text x="560" y="170" font-size="14" font-weight="700" fill="#1F3864">Goal: under 5%</text>
<text x="560" y="189" font-size="12.5" fill="#5b6575">about 1 h 12 min a day</text>
<rect x="190" y="218" width="14" height="14" rx="3" fill="#E7A15B"/>
<text x="214" y="230" font-size="15" font-weight="700" fill="#1e2a38">High</text>
<text x="214" y="249" font-size="12.5" fill="#5b6575">181–250 mg/dL (10.1–13.9 mmol/L)</text>
<text x="560" y="230" font-size="14" font-weight="700" fill="#1F3864">Goal: with very high: under 25%</text>
<text x="560" y="249" font-size="12.5" fill="#5b6575">about 6 h a day in total</text>
<rect x="190" y="316" width="14" height="14" rx="3" fill="#2E6B3E"/>
<text x="214" y="328" font-size="15" font-weight="700" fill="#1e2a38">In range</text>
<text x="214" y="347" font-size="12.5" fill="#5b6575">70–180 mg/dL (3.9–10.0 mmol/L)</text>
<text x="560" y="328" font-size="14" font-weight="700" fill="#1F3864">Goal: more than 70%</text>
<text x="560" y="347" font-size="12.5" fill="#5b6575">about 16 h 48 min a day</text>
<rect x="190" y="414" width="14" height="14" rx="3" fill="#D9534F"/>
<text x="214" y="426" font-size="15" font-weight="700" fill="#1e2a38">Low</text>
<text x="214" y="445" font-size="12.5" fill="#5b6575">54–69 mg/dL (3.0–3.8 mmol/L)</text>
<text x="560" y="426" font-size="14" font-weight="700" fill="#1F3864">Goal: with very low: under 4%</text>
<text x="560" y="445" font-size="12.5" fill="#5b6575">about 58 min a day in total</text>
<rect x="190" y="468" width="14" height="14" rx="3" fill="#8B0000"/>
<text x="214" y="480" font-size="15" font-weight="700" fill="#1e2a38">Very low</text>
<text x="214" y="499" font-size="12.5" fill="#5b6575">below 54 mg/dL (3.0 mmol/L)</text>
<text x="560" y="480" font-size="14" font-weight="700" fill="#1F3864">Goal: under 1%</text>
<text x="560" y="499" font-size="12.5" fill="#5b6575">about 14 min a day</text>
<text x="190" y="530" font-size="13" font-weight="700" fill="#C00000">Step 2 · Look at the lows first.</text><text x="430" y="530" font-size="13" fill="#1e2a38">Then time in range, then the highs. Goals differ for older adults, pregnancy and dialysis.</text>
<text x="976" y="550" font-size="11" fill="#1F3864" fill-opacity=".6" text-anchor="end">© renalcarematters.com · goals per ADA 2026 / International Consensus on Time in Range</text></svg>
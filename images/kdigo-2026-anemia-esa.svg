<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">ESA therapy: individualized adult decisions</title><desc id="desc">KDIGO 2026 clinical reference reviewed November 6, 2026.</desc><rect width="1000" height="850" rx="24" fill="#f4f7fa"/><rect width="1000" height="138" rx="24" fill="#13315a"/><text x="44" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4c842">RENAL CARE MATTERS · KDIGO 2026</text><text x="44" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">ESA therapy: individualized adult decisions</text><rect x="30" y="158" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="158" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Before treatment</text><text x="54" y="220" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Correct reversible causes and review iron availability, blood pressure, symptoms,</text><text x="54" y="244" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">risks, and preferences.</text><rect x="30" y="302" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="302" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Initiation by population</text><text x="54" y="364" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">HD / PD: consider when Hb is ≤9–10 g/dL. Non-dialysis CKD: individualize; Hb &lt;10</text><text x="54" y="388" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">alone is not an automatic order.</text><rect x="30" y="446" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="446" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Maintenance goal: BELOW 11.5 g/dL</text><text x="54" y="508" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Use the lowest effective dose. A value of 11.5 is outside the recommended adult</text><text x="54" y="532" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">maintenance target.</text><rect x="30" y="590" width="940" height="133" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="590" width="7" height="133" rx="3" fill="#1a6b72"/><text x="54" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Monitor the rate of rise</text><text x="54" y="652" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Check Hb every 2–4 weeks after initiation or changes. A rise &gt;1 g/dL in 2–4 weeks</text><text x="54" y="676" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">calls for a 25–50% dose reduction. Generally avoid routine changes more often than</text><text x="54" y="700" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">every 4 weeks.</text><text x="44" y="814" font-family="Arial,sans-serif" font-size="15" fill="#465568">Clinical decisions require individual assessment. Source: KDIGO 2026 Anemia in CKD.</text><text x="44" y="837" font-family="Arial,sans-serif" font-size="14" fill="#465568">renalcarematters.com · Reviewed November 6, 2026 · Hb: hemoglobin; HD: hemodialysis; PD: peritoneal dialysis</text></svg>
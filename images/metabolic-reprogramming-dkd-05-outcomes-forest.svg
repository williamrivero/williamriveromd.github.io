<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="t d" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif">
<title id="t">Forest plot of kidney outcome trials and albuminuria surrogate trials</title>
<desc id="d">Hazard ratios with 95 percent confidence intervals for kidney composite outcomes: CREDENCE 0.70, DAPA-CKD 0.61, EMPA-KIDNEY 0.72, FIDELITY 0.77 and FLOW 0.76. Below a divider, urine albumin-to-creatinine ratio treatment ratios, which are surrogates rather than events: CONFIDENCE combination versus finerenone 0.71 and versus empagliflozin 0.68, FINE-ONE 0.75, and REMODEL 0.60.</desc>
<rect width="1000" height="620" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/></marker></defs><text x="30" y="40" font-size="22" fill="#1F3864" font-weight="700" text-anchor="start">Kidney outcomes versus albuminuria surrogates</text><text x="30" y="64" font-size="13" fill="#5b6678" font-weight="400" text-anchor="start">Each trial uses its own endpoint definition. Do not rank drugs across rows.</text><text x="30" y="104" font-size="13.5" fill="#1F3864" font-weight="700" text-anchor="start">Kidney composite (hazard ratio)</text><text x="40" y="146" font-size="13" fill="#1e2a38" font-weight="400" text-anchor="start">CREDENCE · canagliflozin · T2D</text><line x1="699.5" y1="142" x2="787.4" y2="142" stroke="#1A6B72" stroke-width="2.5"/><rect x="739.1" y="136" width="12" height="12" fill="#1A6B72"/><text x="960" y="146" font-size="12.5" fill="#3d4a5c" font-weight="600" text-anchor="end">0.70 (0.59–0.82)</text><text x="40" y="188" font-size="13" fill="#1e2a38" font-weight="400" text-anchor="start">DAPA-CKD · dapagliflozin · ± diabetes</text><line x1="660.6" y1="184" x2="752.7" y2="184" stroke="#1A6B72" stroke-width="2.5"/><rect x="702.4" y="178" width="12" height="12" fill="#1A6B72"/><text x="960" y="188" font-size="12.5" fill="#3d4a5c" font-weight="600" text-anchor="end">0.61 (0.51–0.72)</text><text x="40" y="230" font-size="13" fill="#1e2a38" font-weight="400" text-anchor="start">EMPA-KIDNEY · empagliflozin · ± diabetes</text><line x1="721.2" y1="226" x2="787.4" y2="226" stroke="#1A6B72" stroke-width="2.5"/><rect x="746.7" y="220" width="12" height="12" fill="#1A6B72"/><text x="960" y="230" font-size="12.5" fill="#3d4a5c" font-weight="600" text-anchor="end">0.72 (0.64–0.82)</text><text x="40" y="272" font-size="13" fill="#1e2a38" font-weight="400" text-anchor="start">FIDELITY · finerenone · T2D (pooled)</text><line x1="733.4" y1="268" x2="806.3" y2="268" stroke="#1A6B72" stroke-width="2.5"/><rect x="764.6" y="262" width="12" height="12" fill="#1A6B72"/><text x="960" y="272" font-size="12.5" fill="#3d4a5c" font-weight="600" text-anchor="end">0.77 (0.67–0.88)</text><text x="40" y="314" font-size="13" fill="#1e2a38" font-weight="400" text-anchor="start">FLOW · semaglutide 1 mg · T2D</text><line x1="729.4" y1="310" x2="806.3" y2="310" stroke="#1A6B72" stroke-width="2.5"/><rect x="761.1" y="304" width="12" height="12" fill="#1A6B72"/><text x="960" y="314" font-size="12.5" fill="#3d4a5c" font-weight="600" text-anchor="end">0.76 (0.66–0.88)</text><line x1="30" y1="338" x2="970" y2="338" stroke="#1F3864" stroke-width="2.5"/><text x="30" y="356" font-size="13.5" fill="#4B3280" font-weight="700" text-anchor="start">UACR ratio — surrogate, not events</text><text x="40" y="398" font-size="13" fill="#1e2a38" font-weight="400" text-anchor="start">CONFIDENCE · combo vs finerenone</text><line x1="708.4" y1="394" x2="787.4" y2="394" stroke="#4B3280" stroke-width="2.5"/><rect x="742.9" y="388" width="12" height="12" fill="#4B3280"/><text x="960" y="398" font-size="12.5" fill="#3d4a5c" font-weight="600" text-anchor="end">0.71 (0.61–0.82)</text><text x="40" y="440" font-size="13" fill="#1e2a38" font-weight="400" text-anchor="start">CONFIDENCE · combo vs empagliflozin</text><line x1="699.5" y1="436" x2="777.4" y2="436" stroke="#4B3280" stroke-width="2.5"/><rect x="731.4" y="430" width="12" height="12" fill="#4B3280"/><text x="960" y="440" font-size="12.5" fill="#3d4a5c" font-weight="600" text-anchor="end">0.68 (0.59–0.79)</text><text x="40" y="482" font-size="13" fill="#1e2a38" font-weight="400" text-anchor="start">FINE-ONE · finerenone · T1D</text><line x1="725.3" y1="478" x2="803.2" y2="478" stroke="#4B3280" stroke-width="2.5"/><rect x="757.6" y="472" width="12" height="12" fill="#4B3280"/><text x="960" y="482" font-size="12.5" fill="#3d4a5c" font-weight="600" text-anchor="end">0.75 (0.65–0.87)</text><text x="40" y="524" font-size="13" fill="#1e2a38" font-weight="
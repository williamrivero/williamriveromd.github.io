<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">Iron decisions in adult CKD anemia</title><desc id="desc">KDIGO 2026 clinical reference reviewed November 6, 2026.</desc><rect width="1000" height="850" rx="24" fill="#f4f7fa"/><rect width="1000" height="138" rx="24" fill="#13315a"/><text x="44" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4c842">RENAL CARE MATTERS · KDIGO 2026</text><text x="44" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">Iron decisions in adult CKD anemia</text><rect x="30" y="158" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="158" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Start: hemodialysis</text><text x="54" y="220" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Ferritin ≤500 ng/mL AND TSAT ≤30%. IV iron is suggested; use a proactive, monitored</text><text x="54" y="244" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">approach.</text><rect x="30" y="302" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="302" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Start: non-dialysis CKD or PD</text><text x="54" y="364" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Ferritin &lt;100 AND TSAT &lt;40%, OR ferritin 100 to &lt;300 AND TSAT &lt;25%. Choose oral or IV</text><text x="54" y="388" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">with the patient.</text><rect x="30" y="446" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="446" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Withhold routine iron</text><text x="54" y="508" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Ferritin &gt;700 ng/mL OR TSAT ≥40%. Consider temporarily pausing iron during systemic</text><text x="54" y="532" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">infection.</text><rect x="30" y="590" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="590" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Ongoing treatment is a separate review</text><text x="54" y="652" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Initiation thresholds are not automatic maintenance stop rules. Review response,</text><text x="54" y="676" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">trends, blood loss, tolerance, and formulation limits.</text><text x="44" y="814" font-family="Arial,sans-serif" font-size="15" fill="#465568">Clinical decisions require individual assessment. Source: KDIGO 2026 Anemia in CKD.</text><text x="44" y="837" font-family="Arial,sans-serif" font-size="14" fill="#465568">renalcarematters.com · Reviewed November 6, 2026 · Hb: hemoglobin; HD: hemodialysis; PD: peritoneal dialysis</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">ESA hyporesponsiveness: find the cause</title><desc id="desc">KDIGO 2026 clinical reference reviewed November 6, 2026.</desc><rect width="1000" height="850" rx="24" fill="#f4f7fa"/><rect width="1000" height="138" rx="24" fill="#13315a"/><text x="44" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4c842">RENAL CARE MATTERS · KDIGO 2026</text><text x="44" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">ESA hyporesponsiveness: find the cause</text><rect x="30" y="158" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="158" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Look beyond the dose</text><text x="54" y="220" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Review iron deficiency or restriction, infection / inflammation, bleeding, hemolysis,</text><text x="54" y="244" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">nutrition, PTH, adherence, dialysis adequacy, and marrow disease.</text><rect x="30" y="302" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="302" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Use ERI as a trend</text><text x="54" y="364" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">No universal KDIGO cutoff. Darbepoetin IU equivalence is approximate and dose-</text><text x="54" y="388" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">dependent; do not assume a fixed CERA conversion.</text><rect x="30" y="446" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="446" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Selected HIF-PHI trial</text><text x="54" y="508" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Discuss limited evidence in hyporesponders. Never combine ESA and HIF-PHI. Review</text><text x="54" y="532" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">malignancy, cardiovascular / thrombotic risk, and local authorization.</text><rect x="30" y="590" width="940" height="133" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="590" width="7" height="133" rx="3" fill="#1a6b72"/><text x="54" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Reassess response and evidence</text><text x="54" y="652" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Stop a HIF-PHI trial for hyporesponsiveness after 3–4 months without the desired</text><text x="54" y="676" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">response. Correct deficiencies; adjunct supplements are not proven routine KDIGO</text><text x="54" y="700" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">anemia therapy.</text><text x="44" y="814" font-family="Arial,sans-serif" font-size="15" fill="#465568">Clinical decisions require individual assessment. Source: KDIGO 2026 Anemia in CKD.</text><text x="44" y="837" font-family="Arial,sans-serif" font-size="14" fill="#465568">renalcarematters.com · Reviewed November 6, 2026 · Hb: hemoglobin; HD: hemodialysis; PD: peritoneal dialysis</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">Anemia care: your numbers, your treatment</title><desc id="desc">KDIGO 2026 clinical reference reviewed November 6, 2026.</desc><rect width="1000" height="850" rx="24" fill="#f4f7fa"/><rect width="1000" height="138" rx="24" fill="#13315a"/><text x="44" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4c842">RENAL CARE MATTERS · KDIGO 2026</text><text x="44" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">Anemia care: your numbers, your treatment</text><rect x="30" y="158" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="158" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Ask what is causing the anemia</text><text x="54" y="220" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Your team checks Hb, iron tests, symptoms, bleeding, infection, and other causes.</text><text x="54" y="244" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Kidney disease is not the only possible reason.</text><rect x="30" y="302" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="302" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Iron route depends on your situation</text><text x="54" y="364" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">IV iron is generally preferred in HD. Oral or IV iron may be chosen in non-dialysis</text><text x="54" y="388" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">CKD and PD.</text><rect x="30" y="446" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="446" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">If you take ESA / EPO</text><text x="54" y="508" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Your adult Hb goal is individualized and below 11.5 g/dL (115 g/L). More EPO does not</text><text x="54" y="532" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">treat every cause of fatigue.</text><rect x="30" y="590" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="590" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Work with your kidney team</text><text x="54" y="652" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Do not change iron or ESA doses yourself. Chest pain, severe breathlessness,</text><text x="54" y="676" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">fainting, or active bleeding needs urgent assessment.</text><text x="44" y="814" font-family="Arial,sans-serif" font-size="15" fill="#465568">Clinical decisions require individual assessment. Source: KDIGO 2026 Anemia in CKD.</text><text x="44" y="837" font-family="Arial,sans-serif" font-size="14" fill="#465568">renalcarematters.com · Reviewed November 6, 2026 · Hb: hemoglobin; HD: hemodialysis; PD: peritoneal dialysis</text></svg>
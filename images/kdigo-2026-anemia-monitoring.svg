<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">CKD anemia: monitoring and review</title><desc id="desc">KDIGO 2026 clinical reference reviewed November 6, 2026.</desc><rect width="1000" height="850" rx="24" fill="#f4f7fa"/><rect width="1000" height="138" rx="24" fill="#13315a"/><text x="44" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4c842">RENAL CARE MATTERS · KDIGO 2026</text><text x="44" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">CKD anemia: monitoring and review</text><rect x="30" y="158" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="158" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Record at each review</text><text x="54" y="220" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Symptoms, Hb trend, ESA product / dose / interval, iron exposure, blood pressure,</text><text x="54" y="244" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">infection, bleeding, and dialysis adequacy.</text><rect x="30" y="302" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="302" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Iron treatment monitoring</text><text x="54" y="364" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Hb, ferritin, and TSAT: every 3 months in non-dialysis CKD / PD; every 1–3 months in</text><text x="54" y="388" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">HD, often monthly.</text><rect x="30" y="446" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="446" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">ESA monitoring</text><text x="54" y="508" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Hb every 2–4 weeks after initiation or adjustment; at least every 3 months during</text><text x="54" y="532" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">maintenance, usually more often in HD.</text><rect x="30" y="590" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="590" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Safety review</text><text x="54" y="652" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Adult ESA goal below 11.5 g/dL. Withhold routine iron at ferritin &gt;700 or TSAT ≥40%.</text><text x="54" y="676" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">No universal KDIGO ERI cutoff of 10 or 14.</text><text x="44" y="814" font-family="Arial,sans-serif" font-size="15" fill="#465568">Clinical decisions require individual assessment. Source: KDIGO 2026 Anemia in CKD.</text><text x="44" y="837" font-family="Arial,sans-serif" font-size="14" fill="#465568">renalcarematters.com · Reviewed November 6, 2026 · Hb: hemoglobin; HD: hemodialysis; PD: peritoneal dialysis</text></svg>
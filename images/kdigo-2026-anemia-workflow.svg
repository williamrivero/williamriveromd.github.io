<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">Evaluate low hemoglobin before treatment</title><desc id="desc">KDIGO 2026 clinical reference reviewed November 6, 2026.</desc><rect width="1000" height="850" rx="24" fill="#f4f7fa"/><rect width="1000" height="138" rx="24" fill="#13315a"/><text x="44" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4c842">RENAL CARE MATTERS · KDIGO 2026</text><text x="44" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">Evaluate low hemoglobin before treatment</text><rect x="30" y="158" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="158" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">1  Confirm anemia</text><text x="54" y="220" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Adult Hb &lt;13 g/dL in men or &lt;12 g/dL in women. Review the CBC and reticulocytes;</text><text x="54" y="244" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">children require age-specific criteria.</text><rect x="30" y="302" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="302" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">2  Find the cause</text><text x="54" y="364" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Assess ferritin AND TSAT, bleeding, inflammation, nutrition, hemolysis, and other</text><text x="54" y="388" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">causes. CKD can coexist with another cause.</text><rect x="30" y="446" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="446" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">3  Select the population-specific pathway</text><text x="54" y="508" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">HD iron criteria differ from non-HD / PD. Review iron withhold limits and systemic</text><text x="54" y="532" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">infection. Individualize ESA initiation.</text><rect x="30" y="590" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="590" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">4  Reassess</text><text x="54" y="652" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Adult ESA goal: Hb below 11.5 g/dL. Check Hb in 2–4 weeks after ESA changes. Evaluate</text><text x="54" y="676" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">hyporesponsiveness before escalating.</text><text x="44" y="814" font-family="Arial,sans-serif" font-size="15" fill="#465568">Clinical decisions require individual assessment. Source: KDIGO 2026 Anemia in CKD.</text><text x="44" y="837" font-family="Arial,sans-serif" font-size="14" fill="#465568">renalcarematters.com · Reviewed November 6, 2026 · Hb: hemoglobin; HD: hemodialysis; PD: peritoneal dialysis</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif">
<title id="t">Evidence ladder for metabolic reprogramming and ferroptosis in DKD</title>
<desc id="d">Five rungs from strongest to weakest: kidney outcome randomized trials that change prescribing; randomized surrogate or mechanistic trials; human tissue associations that show a signature but not cause; experimental perturbation and rescue that tests causation in models; and the unproven hypothesis that ferroptosis mediates the benefit of approved drugs.</desc>
<rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/></marker></defs><text x="30" y="40" font-size="22" fill="#1F3864" font-weight="700" text-anchor="start">How far each kind of evidence can take us</text><rect x="30" y="70" width="760" height="78" rx="12" fill="#ffffff" stroke="#2E6B3E" stroke-width="1.6"/><rect x="30" y="70" width="10" height="78" rx="5" fill="#2E6B3E"/><text x="56" y="100" font-size="15.5" fill="#1e2a38" font-weight="700" text-anchor="start">Kidney and survival outcomes in RCTs</text><text x="56" y="126" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">CREDENCE · DAPA-CKD · EMPA-KIDNEY · FIDELITY · FLOW</text><rect x="800" y="92" width="172" height="34" rx="17" fill="#ffffff" stroke="#2E6B3E" stroke-width="1.6"/><text x="886" y="114" font-size="12" fill="#2E6B3E" font-weight="700" text-anchor="middle">Changes prescribing</text><rect x="52" y="162" width="738" height="78" rx="12" fill="#ffffff" stroke="#1A6B72" stroke-width="1.6"/><rect x="52" y="162" width="10" height="78" rx="5" fill="#1A6B72"/><text x="78" y="192" font-size="15.5" fill="#1e2a38" font-weight="700" text-anchor="start">Randomized surrogate or mechanistic trials</text><text x="78" y="218" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">CONFIDENCE (UACR) · FINE-ONE (UACR) · REMODEL (MRI, biopsy)</text><rect x="800" y="184" width="172" height="34" rx="17" fill="#ffffff" stroke="#1A6B72" stroke-width="1.6"/><text x="886" y="206" font-size="12" fill="#1A6B72" font-weight="700" text-anchor="middle">Supports, with caveats</text><rect x="74" y="254" width="716" height="78" rx="12" fill="#ffffff" stroke="#1F3864" stroke-width="1.6"/><rect x="74" y="254" width="10" height="78" rx="5" fill="#1F3864"/><text x="100" y="284" font-size="15.5" fill="#1e2a38" font-weight="700" text-anchor="start">Human tissue associations</text><text x="100" y="310" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">Fibrotic tubule FAO genes · DKD biopsy 4-HNE, SQSTM1, p-AMPK · podocyte single-cell atlases</text><rect x="800" y="276" width="172" height="34" rx="17" fill="#ffffff" stroke="#1F3864" stroke-width="1.6"/><text x="886" y="298" font-size="12" fill="#1F3864" font-weight="700" text-anchor="middle">Signature, not cause</text><rect x="96" y="346" width="694" height="78" rx="12" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><rect x="96" y="346" width="10" height="78" rx="5" fill="#C55A11"/><text x="122" y="376" font-size="15.5" fill="#1e2a38" font-weight="700" text-anchor="start">Experimental perturbation and rescue</text><text x="122" y="402" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">Gpx4 deletion · Atg5 loss · SPARC/Klotho mice · SGLT2i and metformin in models</text><rect x="800" y="368" width="172" height="34" rx="17" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><text x="886" y="390" font-size="12" fill="#C55A11" font-weight="700" text-anchor="middle">Tests causation in models</text><rect x="118" y="438" width="672" height="78" rx="12" fill="#ffffff" stroke="#4B3280" stroke-width="1.6"/><rect x="118" y="438" width="10" height="78" rx="5" fill="#4B3280"/><text x="144" y="468" font-size="15.5" fill="#1e2a38" font-weight="700" text-anchor="start">Hypothesis</text><text x="144" y="494" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">Ferroptosis mediates the benefit of approved kidney drugs in people</text><rect x="800" y="460" width="172" height="34" rx="17" fill="#ffffff" stroke="#4B3280" stroke-width="1.6"/><text x="886" y="482" font-size="12" fill="#4B3280" font-weight="700" text-anchor="middle">Unproven</text><text x="30" y="540" font-size="12" fill="#5b6678" font-weight="400" text-anchor="start" font-style="italic">Certainty rises toward the top; each rung answers a different question.</text>
<text x="986" y="548" text-anchor="end" font-size="11" fill="#1F3864" fill-opacity="0.55">© renalcarematters.com</text>
</svg>

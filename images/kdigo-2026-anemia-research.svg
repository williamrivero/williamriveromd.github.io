<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc"><title id="title">Future therapies: research is not a prescription</title><desc id="desc">KDIGO 2026 clinical reference reviewed November 6, 2026.</desc><rect width="1000" height="850" rx="24" fill="#f4f7fa"/><rect width="1000" height="138" rx="24" fill="#13315a"/><text x="44" y="43" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f4c842">RENAL CARE MATTERS · KDIGO 2026</text><text x="44" y="82" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">Future therapies: research is not a</text><text x="44" y="116" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="white">prescription</text><rect x="30" y="158" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="158" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="190" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Hepcidin and iron availability</text><text x="54" y="220" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Researchers are studying ways to improve iron mobilization and understand</text><text x="54" y="244" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">inflammation.</text><rect x="30" y="302" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="302" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="334" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Biomarkers and assisted dosing</text><text x="54" y="364" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">New measurements and algorithms require clinical validation for the population and</text><text x="54" y="388" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">decision in question.</text><rect x="30" y="446" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="446" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Current practice still applies</text><text x="54" y="508" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">Use population-specific iron criteria, individualized ESA decisions, safety review,</text><text x="54" y="532" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">and appropriate monitoring.</text><rect x="30" y="590" width="940" height="130" rx="12" fill="white" stroke="#d3dee8"/><rect x="30" y="590" width="7" height="130" rx="3" fill="#1a6b72"/><text x="54" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#13315a">Avoid unsupported benefit claims</text><text x="54" y="652" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">A proposed mechanism or illustration does not establish cardiovascular benefit,</text><text x="54" y="676" font-family="Arial,sans-serif" font-size="19" fill="#2c3340">quality-of-life benefit, or a safe dose.</text><text x="44" y="814" font-family="Arial,sans-serif" font-size="15" fill="#465568">Clinical decisions require individual assessment. Source: KDIGO 2026 Anemia in CKD.</text><text x="44" y="837" font-family="Arial,sans-serif" font-size="14" fill="#465568">renalcarematters.com · Reviewed November 6, 2026 · Hb: hemoglobin; HD: hemodialysis; PD: peritoneal dialysis</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="Inter, 'Nunito Sans', Manrope, Arial, sans-serif">
<title id="t">Review lens: congestion evidence by ultrafiltration tolerance</title>
<desc id="d">A three-by-three grid. Rows are congestion evidence: present, uncertain, absent on available assessment. Columns are ultrafiltration tolerance in reviewed sessions: adequate, uncertain, recurrently impaired. Each cell names the review emphasis, not a treatment. The top-right cell, congested and poorly tolerant, is highlighted as the hardest and most important state. Residual kidney function is a third axis that modifies every cell.</desc>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="40" y="50" font-size="26" font-weight="700" fill="#0f1e2e">A review lens, not a score: congestion × UF tolerance</text>
<text x="40" y="80" font-size="16" fill="#3b4a5c">Each cell names what to review next. None of them outputs a target weight, a UF rate or a drug order.</text>

<!-- axis labels -->
<text x="300" y="128" font-size="15" font-weight="700" fill="#0f1e2e" text-anchor="middle">Adequate tolerance</text>
<text x="600" y="128" font-size="15" font-weight="700" fill="#0f1e2e" text-anchor="middle">Tolerance uncertain</text>
<text x="900" y="128" font-size="15" font-weight="700" fill="#0f1e2e" text-anchor="middle">Recurrently impaired</text>
<text x="600" y="106" font-size="13" fill="#3b4a5c" text-anchor="middle">UF TOLERANCE IN REVIEWED SESSIONS →</text>

<g font-size="15" font-weight="700" fill="#0f1e2e">
<text x="70" y="215" text-anchor="middle">Present</text>
<text x="70" y="405" text-anchor="middle">Uncertain</text>
<text x="70" y="585" text-anchor="middle">Absent*</text>
</g>
<text x="24" y="400" font-size="13" fill="#3b4a5c" transform="rotate(-90 24 400)" text-anchor="middle">CONGESTION EVIDENCE →</text>

<!-- row 1 -->
<rect x="150" y="145" width="296" height="170" rx="14" fill="#eef6f7" stroke="#1a6b72"/>
<text x="166" y="175" font-size="16" font-weight="700" fill="#0e4a50">Volume excess, tolerated</text>
<text x="166" y="202" font-size="14" fill="#2a3548">Why is the target not reached?</text>
<text x="166" y="224" font-size="14" fill="#2a3548">Delivered time, IDWG drivers,</text>
<text x="166" y="246" font-size="14" fill="#2a3548">sodium, target plausibility.</text>
<text x="166" y="276" font-size="13" fill="#3b4a5c">Links: P03 hypertension, P05 UFR</text>

<rect x="452" y="145" width="296" height="170" rx="14" fill="#f8f5f0" stroke="#b8860b"/>
<text x="468" y="175" font-size="16" font-weight="700" fill="#5c3d00">Excess, tolerance unclear</text>
<text x="468" y="202" font-size="14" fill="#2a3548">Document session events,</text>
<text x="468" y="224" font-size="14" fill="#2a3548">BP timing, rescue use and</text>
<text x="468" y="246" font-size="14" fill="#2a3548">early stops before changing.</text>
<text x="468" y="276" font-size="13" fill="#3b4a5c">Links: P07 discordant data</text>

<rect x="754" y="145" width="296" height="170" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="3"/>
<text x="770" y="175" font-size="16" font-weight="700" fill="#7f1d1d">Congested AND intolerant</text>
<text x="770" y="202" font-size="14" fill="#2a3548">Change the delivery burden</text>
<text x="770" y="224" font-size="14" fill="#2a3548">(time, frequency, sodium) rather</text>
<text x="770" y="246" font-size="14" fill="#2a3548">than force UF or accept overload.</text>
<text x="770" y="276" font-size="13" fill="#3b4a5c">Links: P02 (core), P01, P05</text>

<!-- row 2 -->
<rect x="150" y="330" width="296" height="160" rx="14" fill="#f3f4f6" stroke="#c7cfdb"/>
<text x="166" y="360" font-size="16" font-weight="700" fill="#0f1e2e">Status unclear, tolerated</text>
<text x="166" y="387" font-size="14" fill="#2a3548">Is the assessment current?</text>
<text x="166" y="409" font-size="14" fill="#2a3548">Examine, review out-of-unit BP,</text>
<text x="166" y="431" font-size="14" fill="#2a3548">consider a tool if it would</text>
<text x="166" y="453" font-size="14" fill="#2a3548">change the decision.</text>

<rect x="452" y="330" width="296" height="160" rx="14" fill="#f3f4f6" stroke="#c7cfdb"/>
<text x="468" y="360" font-size="16" font-weight="700" fill="#0f1e2e">Both axes uncertain</text>
<text x="468" y="387" font-size="14" fill="#2a3548">"Information needed" is the</text>
<text x="468" y="409" font-size="14" fill="#2a3548">correct output. Collect the</text>
<text x="468" y="431" font-size="14" fill="#2a3548">minimum dataset first.</text>
<text x="468" y="461" font-size="13" fill="#3b4a5c">Links: M02 measurement quality</text>

<rect x="754" y="330" width="296" height="160" rx="14" fill="#f8f5f0" stroke="#b8860b"/>
<text x="770" y="360" font-size="16" font-weight="700" fill="#5c3d00">Intolerant, volume unclear</text>
<text x="770" y="387" font-size="14" fill="#2a3548">Do not assume hypovolemia.</text>
<text x="770" y="409" font-size="14" fill="#2a3548">Assess congestion directly; screen</text>
<text x="770" y="431" font-size="14" fill="#2a3548">cardiac, rhythm, drug, infection.</text>
<text x="770" y="461" font-size="13" fill="#3b4a5c">Links: P01 recurrent IDH, P07</text>

<!-- row 3 -->
<rect x="150" y="505" width="296" height="160" rx="14" fill="#f3f4f6" stroke="#c7cfdb"/>
<text x="166" y="535" font-size="16" font-weight="700" fill="#0f1e2e">No evident excess, tolerated</text>
<text x="166" y="562" font-size="14" fill="#2a3548">Stable BP is not proof of</text>
<text x="166" y="584" font-size="14" fill="#2a3548">euvolemia. Watch tissue-weight</text>
<text x="166" y="606" font-size="14" fill="#2a3548">change and nutrition.</text>
<text x="166" y="636" font-size="13" fill="#3b4a5c">Links: case C05 low IDWG</text>

<rect x="452" y="505" width="296" height="160" rx="14" fill="#f3f4f6" stroke="#c7cfdb"/>
<text x="468" y="535" font-size="16" font-weight="700" fill="#0f1e2e">No excess, tolerance unclear</text>
<text x="468" y="562" font-size="14" fill="#2a3548">Review session records and</text>
<text x="468" y="584" font-size="14" fill="#2a3548">symptom timing before acting</text>
<text x="468" y="606" font-size="14" fill="#2a3548">on a single episode.</text>

<rect x="754" y="505" width="296" height="160" rx="14" fill="#eef6f7" stroke="#1a6b72"/>
<text x="770" y="535" font-size="16" font-weight="700" fill="#0e4a50">Intolerant, not congested</text>
<text x="770" y="562" font-size="14" fill="#2a3548">Is the target weight too low?</text>
<text x="770" y="584" font-size="14" fill="#2a3548">Has lean mass been lost? Review</text>
<text x="770" y="606" font-size="14" fill="#2a3548">drugs, cardiac and autonomic causes.</text>
<text x="770" y="636" font-size="13" fill="#3b4a5c">Links: P01, M08 target weight</text>

<!-- RKF modifier -->
<rect x="150" y="690" width="900" height="60" rx="14" fill="#ffffff" stroke="#1f3864" stroke-dasharray="6 5"/>
<text x="170" y="718" font-size="15" font-weight="700" fill="#0f1e2e">Third axis, modifies every cell: residual kidney function</text>
<text x="170" y="740" font-size="14" fill="#2a3548">measured (method + date) / urine output only / unknown. Urine volume is not clearance. Protect it when you can.</text>

<text x="40" y="784" font-size="13" fill="#3b4a5c">*Absent on available assessment. Teaching synthesis, not a validated classification. IDH, intradialytic hypotension; IDWG, interdialytic weight gain; UF, ultrafiltration.</text>
<text x="1160" y="770" font-size="12" fill="#0f1e2e" fill-opacity="0.7" text-anchor="end">© renalcarematters.com</text>
</svg>

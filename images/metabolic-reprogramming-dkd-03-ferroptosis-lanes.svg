<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="t d" font-family="Inter, Manrope, 'Segoe UI', Arial, sans-serif">
<title id="t">The three lanes of ferroptosis: substrate, oxidation and defense</title>
<desc id="d">Three numbered lanes. Lane one: ACSL4 and LPCAT3 load polyunsaturated fatty acids into membrane phospholipids. Lane two: redox-active iron and radicals propagate phospholipid peroxidation, damaging the membrane and causing ferroptotic death. Lane three: the cystine-glutamate antiporter SLC7A11 supplies cysteine for glutathione, which GPX4 uses to reduce phospholipid hydroperoxides, with FSP1 and coenzyme Q as a parallel defense. A footer lists experimental upstream stresses.</desc>
<rect width="1000" height="660" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6678"/></marker><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C00000"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B3E"/></marker></defs><text x="30" y="40" font-size="22" fill="#1F3864" font-weight="700" text-anchor="start">How a vulnerable membrane becomes a site of injury</text><text x="30" y="64" font-size="13" fill="#5b6678" font-weight="400" text-anchor="start">Ferroptosis: regulated cell death driven by iron-dependent phospholipid peroxidation</text><rect x="30" y="95" width="940" height="140" rx="12" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><rect x="30" y="95" width="940" height="34" rx="12" fill="#C55A11" fill-opacity="0.12"/><text x="48" y="118" font-size="15" fill="#C55A11" font-weight="700" text-anchor="start">1  Substrate</text><rect x="90.0" y="147" width="120" height="38" rx="19" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><text x="150" y="171" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">PUFA</text><rect x="270.0" y="147" width="120" height="38" rx="19" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><text x="330" y="171" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">ACSL4</text><line x1="214.0" y1="166" x2="264.0" y2="166" stroke="#C55A11" stroke-width="2" marker-end="url(#a)"/><rect x="450.0" y="147" width="120" height="38" rx="19" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><text x="510" y="171" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">LPCAT3</text><line x1="394.0" y1="166" x2="444.0" y2="166" stroke="#C55A11" stroke-width="2" marker-end="url(#a)"/><rect x="600.7" y="147" width="238.60000000000002" height="38" rx="19" fill="#ffffff" stroke="#C55A11" stroke-width="1.6"/><text x="720" y="171" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">PUFA in membrane phospholipid</text><line x1="574.0" y1="166" x2="594.7" y2="166" stroke="#C55A11" stroke-width="2" marker-end="url(#a)"/><text x="48" y="215" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">ACSL4 activates susceptible polyunsaturated fatty acids; remodeling enzymes such as LPCAT3 place them in membranes</text><rect x="30" y="265" width="940" height="140" rx="12" fill="#ffffff" stroke="#C00000" stroke-width="1.6"/><rect x="30" y="265" width="940" height="34" rx="12" fill="#C00000" fill-opacity="0.12"/><text x="48" y="288" font-size="15" fill="#C00000" font-weight="700" text-anchor="start">2  Oxidation</text><rect x="74.39999999999999" y="317" width="231.20000000000002" height="38" rx="19" fill="#ffffff" stroke="#C00000" stroke-width="1.6"/><text x="190" y="341" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">Redox-active Fe²⁺ + radicals</text><rect x="350.7" y="317" width="238.60000000000002" height="38" rx="19" fill="#ffffff" stroke="#C00000" stroke-width="1.6"/><text x="470" y="341" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">Phospholipid peroxides spread</text><line x1="309.6" y1="336" x2="344.7" y2="336" stroke="#C00000" stroke-width="2" marker-end="url(#a1)"/><rect x="662.9" y="317" width="194.20000000000002" height="38" rx="19" fill="#ffffff" stroke="#C00000" stroke-width="1.6"/><text x="760" y="341" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">Membrane damage → death</text><line x1="593.3" y1="336" x2="656.9" y2="336" stroke="#C00000" stroke-width="2" marker-end="url(#a1)"/><text x="48" y="385" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">Oxidation propagates when it outruns repair; excess oxidized phospholipid compromises the membrane</text><rect x="30" y="435" width="940" height="140" rx="12" fill="#ffffff" stroke="#2E6B3E" stroke-width="1.6"/><rect x="30" y="435" width="940" height="34" rx="12" fill="#2E6B3E" fill-opacity="0.12"/><text x="48" y="458" font-size="15" fill="#2E6B3E" font-weight="700" text-anchor="start">3  Defense</text><rect x="84.0" y="487" width="172.0" height="38" rx="19" fill="#ffffff" stroke="#2E6B3E" stroke-width="1.6"/><text x="170" y="511" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">System xc⁻ (SLC7A11)</text><rect x="336.2" y="487" width="127.60000000000001" height="38" rx="19" fill="#ffffff" stroke="#2E6B3E" stroke-width="1.6"/><text x="400" y="511" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">Cysteine → GSH</text><line x1="260.0" y1="506" x2="330.2" y2="506" stroke="#2E6B3E" stroke-width="2" marker-end="url(#a2)"/><rect x="547.7" y="487" width="164.6" height="38" rx="19" fill="#ffffff" stroke="#2E6B3E" stroke-width="1.6"/><text x="630" y="511" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">GPX4 reduces PL-OOH</text><line x1="467.8" y1="506" x2="541.7" y2="506" stroke="#2E6B3E" stroke-width="2" marker-end="url(#a2)"/><text x="48" y="555" font-size="12.5" fill="#3d4a5c" font-weight="400" text-anchor="start">Cystine in, glutamate out; glutathione lets GPX4 detoxify phospholipid hydroperoxides; FSP1–CoQ is a second brake</text><rect x="790" y="487" width="160" height="38" rx="19" fill="#ffffff" stroke="#2E6B3E" stroke-width="1.6" stroke-dasharray="5 4"/><text x="870" y="511" font-size="12.5" fill="#1e2a38" font-weight="600" text-anchor="middle">FSP1–CoQ (parallel)</text><rect x="30" y="590" width="940" height="34" rx="10" fill="#f5f2fb" stroke="#4B3280" stroke-width="1.6" stroke-dasharray="5 4"/><text x="48" y="612" font-size="12.5" fill="#4B3280" font-weight="600" text-anchor="start">Upstream stresses tested in experiments: carbonyl/AGE stress · impaired autophagy and low AMPK · mitochondrial ROS · TGF-β signaling</text>

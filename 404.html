<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page Not Found · W. G. M. Rivero, MD</title>
<script>
// Redirect extensionless guide URLs → .html (e.g. /guides/bp-log-blank → /guides/bp-log-blank.html)
(function () {
  var p = window.location.pathname;
  if (p && !p.match(/\.\w+$/) && !p.endsWith('/')) {
    window.location.replace(p + '.html' + window.location.search + window.location.hash);
  }
})();
</script>
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #f9fafb; color: #1e2a38;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { max-width: 460px; text-align: center; padding: 40px 24px; }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
  p  { color: #4a5568; margin-bottom: 24px; line-height: 1.6; }
  a  { display: inline-block; background: #1a6b72; color: #fff; text-decoration: none;
       padding: 10px 24px; border-radius: 8px; font-weight: 600; }
  a:hover { background: #145c63; }
</style>
</head>
<body>
<div class="box">
  <h1>Page not found</h1>
  <p>The guide you're looking for may have moved or the link is missing <code>.html</code>.<br>
     Redirecting you now&hellip;</p>
  <a href="/guides/">Browse all guides</a>
</div>
</body>
</html>
